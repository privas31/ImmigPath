window.createDemo = async function() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  btn.disabled = true;
  
  try {
    // Delete existing demo clients
    status.className = 'status info';
    status.innerHTML = '🗑️ Limpiando clientes anteriores...';
    const q = query(collection(db,"clientes"), where("officeId","==",OFFICE_ID));
    const existing = await getDocs(q);
    for(const d of existing.docs) await deleteDoc(doc(db,"clientes",d.id));
    
    // Create new demo clients
    let created = 0;
    for(const cliente of demoClientes) {
      status.innerHTML = `⏳ Creando cliente ${created+1} de ${demoClientes.length}: <strong>${cliente.nombre}</strong>`;
      await addDoc(collection(db,"clientes"), cliente);
      created++;
      bar.style.width = (created/demoClientes.length*100)+'%';
      await new Promise(r=>setTimeout(r,300));
    }
    
    bar.style.width = '100%';
    bar.style.background = '#059669';
    status.className = 'status ok';
    status.innerHTML = `✅ ¡Demo lista! Se crearon <strong>${created} clientes</strong> ficticios.<br><br>
      <a href="https://immigpath.com/app.html?o=ml4IRNg1OLF9IhVI4S1g" target="_blank" style="color:#34D399;font-weight:700">
        → Abrir demo en ImmigPath
      </a>`;
    btn.textContent = '✅ Demo creada exitosamente';
    
  } catch(e) {
    status.className = 'status err';
    status.innerHTML = '❌ Error: ' + e.message;
    btn.disabled = false;
    btn.textContent = '🔄 Intentar de nuevo';
  }
};
