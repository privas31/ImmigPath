// ── Helpers ───────────────────────────────────────────────────────────────────
function getStatus(f){if(!f)return"pendiente";const h=new Date();h.setHours(0,0,0,0);const d=Math.round((new Date(f+"T00:00:00")-h)/86400000);if(d<0)return"vencido";if(d===0)return"hoy";if(d<=3)return"urgente";if(d<=14)return"proximo";return"ok";}
function getDias(f){if(!f)return null;const h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(f+"T00:00:00")-h)/86400000);}
function fmt(f){if(!f)return"—";const[y,m,d]=f.split("-");return`${m}/${d}/${y}`;}
function fmtA(a){const c=(a||"").replace(/\D/g,"").slice(0,9);if(c.length<=3)return c;if(c.length<=6)return c.slice(0,3)+"-"+c.slice(3);return c.slice(0,3)+"-"+c.slice(3,6)+"-"+c.slice(6);}
function eoirUrl(a){return`https://acis.eoir.justice.gov/en/CaseInformation?caseNumber=${(a||"").replace(/\D/g,"")}`;}
function uscisUrl(r){return`https://egov.uscis.gov/casestatus/mycasestatus.do?appReceiptNum=${(r||"").replace(/\s/g,"")}`;}
function fmtMoney(v){if(!v&&v!==0)return"";const n=parseFloat(v.toString().replace(/[^0-9.]/g,""));if(isNaN(n))return"";return"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseMoney(v){return parseFloat((v||"0").toString().replace(/[^0-9.]/g,""))||0;}
function getPct(total,pagado){if(!total)return null;return Math.min(100,Math.round((pagado/total)*100));}
function pagoColor(pct){if(pct===null)return"#6B7280";if(pct>=100)return"#16A34A";if(pct>=50)return"#D97706";return"#DC2626";}
function getTotalProcesos(procesos){return(procesos||[]).reduce((s,p)=>s+parseMoney(p.precio),0);}
function getTotalPagado(procesos){return(procesos||[]).reduce((s,p)=>s+parseMoney(p.pagado),0);}
function getProximaFecha(cliente){const fechas=[];(cliente.casos||[]).forEach(c=>{if(c.fechaCorte)fechas.push(c.fechaCorte);if(c.fechaHuellas)fechas.push(c.fechaHuellas);});if(!fechas.length)return null;const hoy=new Date();hoy.setHours(0,0,0,0);const futuras=fechas.filter(f=>new Date(f+"T00:00:00")>=hoy).sort();if(futuras.length)return futuras[0];return fechas.sort().reverse()[0];}
function getStatusCliente(cliente){const pf=getProximaFecha(cliente);if(!pf)return"pendiente";return getStatus(pf);}

// ── Editor de procesos de pago ────────────────────────────────────────────────
function ProcesosEditor({procesos,onChange}){
  const add=()=>onChange([...procesos,{nombre:"",precio:"",pagado:"",notas:"",id:Date.now()}]);
  const upd=(i,f,v)=>{const n=[...procesos];n[i]={...n[i],[f]:v};onChange(n);};
  const del=(i)=>onChange(procesos.filter((_,idx)=>idx!==i));
  const total=getTotalProcesos(procesos);const pagado=getTotalPagado(procesos);const pct=getPct(total,pagado);const pc=pagoColor(pct);
  return(<div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"12px",marginBottom:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:12,fontWeight:700,color:"#D97706"}}>💰 Pagos de este proceso</div>
      <button onClick={add} style={{background:"#1E40AF",color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>+ Agregar pago</button>
    </div>
    {procesos.length===0&&<div style={{fontSize:11,color:"#94A3B8",textAlign:"center",padding:"6px 0"}}>Sin pagos registrados</div>}
    {procesos.map((p,i)=>(
      <div key={p.id||i} style={{background:"#fff",borderRadius:7,padding:"9px 11px",marginBottom:7,border:"1px solid #FDE68A"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
          <select value={p.nombre} onChange={e=>upd(i,"nombre",e.target.value)} style={{flex:1,padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,background:"#fff",cursor:"pointer",marginRight:8}}>
            <option value="">Seleccionar proceso...</option>{PROCESOS_COMUNES.map(pc=><option key={pc} value={pc}>{pc}</option>)}
          </select>
          <button onClick={()=>del(i)} style={{background:"#FEF2F2",color:"#EF4444",border:"1px solid #FECACA",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:6}}>
          <div><label style={{display:"block",fontSize:10,fontWeight:600,color:"#374151",marginBottom:2,textTransform:"uppercase"}}>Precio</label><input value={p.precio} onChange={e=>upd(i,"precio",e.target.value)} placeholder="Ej. 2500" style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,outline:"none"}}/></div>
          <div><label style={{display:"block",fontSize:10,fontWeight:600,color:"#374151",marginBottom:2,textTransform:"uppercase"}}>Pagado</label><input value={p.pagado} onChange={e=>upd(i,"pagado",e.target.value)} placeholder="Ej. 1000" style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,outline:"none"}}/></div>
        </div>
        {p.precio&&<><div style={{background:"#E2E8F0",borderRadius:20,height:4}}><div style={{height:"100%",borderRadius:20,background:pagoColor(getPct(parseMoney(p.precio),parseMoney(p.pagado))),width:`${getPct(parseMoney(p.precio),parseMoney(p.pagado))||0}%`}}/></div><div style={{fontSize:10,color:pagoColor(getPct(parseMoney(p.precio),parseMoney(p.pagado))),fontWeight:700,marginTop:2}}>{fmtMoney(p.pagado)||"$0"} / {fmtMoney(p.precio)} — {getPct(parseMoney(p.precio),parseMoney(p.pagado))||0}%</div></>}
        <input value={p.notas||""} onChange={e=>upd(i,"notas",e.target.value)} placeholder="Notas de pago..." style={{width:"100%",padding:"5px 8px",borderRadius:6,border:"1px solid #E2E8F0",fontSize:11,outline:"none",marginTop:6}}/>
      </div>
    ))}
    {procesos.length>0&&<div style={{background:"#FEF9C3",borderRadius:7,padding:"8px 11px",border:"1px solid #FDE68A"}}>
      <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,fontWeight:700,color:"#92400E"}}>Total</span><span style={{fontSize:12,fontWeight:800,color:"#92400E"}}>{fmtMoney(pagado)} / {fmtMoney(total)}</span></div>
      <div style={{background:"#E2E8F0",borderRadius:20,height:5,marginTop:4}}><div style={{height:"100%",borderRadius:20,background:pc,width:`${pct||0}%`}}/></div>
      <div style={{fontSize:10,color:pc,fontWeight:700,marginTop:2}}>{pct!==null?`${pct}% — Saldo: ${fmtMoney(total-pagado)}`:"Sin info"}</div>
    </div>}
  </div>);
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const login=async()=>{if(!email||!pw){setErr("Ingresa tu email y contraseña");return;}setLoading(true);setErr("");
    try{
      const{auth,signInWithEmailAndPassword,db,doc,getDoc}=window._firebase;
      const cred=await signInWithEmailAndPassword(auth,email,pw);
      const userDoc=await getDoc(doc(db,"users",cred.user.uid));
      if(!userDoc.exists())throw new Error("Usuario no encontrado");
      const userData=userDoc.data();
      if(!["office_admin","employee","superadmin"].includes(userData.role))throw new Error("Sin acceso");
      // Get office data
      let officeInfo=null;
      if(userData.officeId){
        const officeDoc=await getDoc(doc(db,"offices",userData.officeId));
        if(officeDoc.exists())officeInfo={id:officeDoc.id,...officeDoc.data()};
      }
      onLogin(cred.user,userData,officeInfo);
    }catch(e){setErr("Email o contraseña incorrectos");}setLoading(false);};
  return(<div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0F172A 0%,#1E40AF 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:400,padding:36,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
      <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:48,marginBottom:8}}>⚖️</div><h1 style={{fontSize:22,fontWeight:800,color:"#0F172A",margin:0}}>Monitor de Inmigración</h1><p style={{fontSize:13,color:"#64748B",marginTop:6}}>Ingresa con tu cuenta para continuar</p></div>
      <div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" onKeyDown={e=>e.key==="Enter"&&login()} style={{width:"100%",padding:"11px 13px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/></div>
      <div style={{marginBottom:20}}><label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>Contraseña</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&login()} style={{width:"100%",padding:"11px 13px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/></div>
      {err&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#DC2626",marginBottom:16}}>⚠️ {err}</div>}
      <button onClick={login} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:9,border:"none",background:loading?"#E5E7EB":"#1E40AF",color:loading?"#9CA3AF":"#fff",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer"}}>{loading?"Ingresando...":"Ingresar →"}</button>
    </div></div>);
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);const[userData,setUserData]=useState(null);const[officeData,setOfficeData]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[clientes,setClientes]=useState([]);const[loading,setLoading]=useState(false);
  const[showModal,setShowModal]=useState(false);const[editId,setEditId]=useState(null);const[formCliente,setFormCliente]=useState(emptyCliente);
  const[filtroStatus,setFiltroStatus]=useState("todos");const[filtroSistema,setFiltroSistema]=useState("todos");
  const[busqueda,setBusqueda]=useState("");const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState(null);const[sortBy,setSortBy]=useState("fecha");
  const[confirmDelete,setConfirmDelete]=useState(null);const[expandedId,setExpandedId]=useState(null);const[activeCasoTab,setActiveCasoTab]=useState({});
  const[showPDF,setShowPDF]=useState(false);const[pdfOpts,setPdfOpts]=useState({sistema:"todos",estado:"todos"});
  const[showAddUser,setShowAddUser]=useState(false);const[newUserEmail,setNewUserEmail]=useState("");const[newUserPass,setNewUserPass]=useState("");const[addUserMsg,setAddUserMsg]=useState("");
  const[equipo,setEquipo]=useState([]);const[showTeam,setShowTeam]=useState(false);const[newMember,setNewMember]=useState("");
  const[showDashboard,setShowDashboard]=useState(false);
  const[borradores,setBorradores]=useState([]);const[showBorradores,setShowBorradores]=useState(false);
  const[borradoresLoading,setBorradoresLoading]=useState(false);const[borradoresPendientes,setBorradoresPendientes]=useState(0);

  useEffect(()=>{
    const{auth,onAuthStateChanged}=window._firebase;
    return onAuthStateChanged(auth,async u=>{
      if(!u){setUser(null);setAuthLoading(false);return;}
      // Auto-restore session
      try{
        const{db,doc,getDoc}=window._firebase;
        const userDoc=await getDoc(doc(db,"users",u.uid));
        if(userDoc.exists()){
          const ud=userDoc.data();
          setUserData(ud);
          if(ud.officeId){
            const officeDoc=await getDoc(doc(db,"offices",ud.officeId));
            if(officeDoc.exists())setOfficeData({id:officeDoc.id,...officeDoc.data()});
          }
          setUser(u);
        }
      }catch(e){console.error(e);}
      setAuthLoading(false);
    });
  },[]);

  useEffect(()=>{if(!user||!officeData)return;loadCases();loadTeam();loadBorradores();},[user,officeData]);

  const handleLogin=(u,ud,od)=>{setUser(u);setUserData(ud);setOfficeData(od);};

  const loadCases=async()=>{
    setLoading(true);
    try{
      const{db,collection,getDocs,query,where,orderBy}=window._firebase;
      const officeId=officeData?.id||userData?.officeId;
      // ═══ MULTI-OFFICE: filter by officeId ═══
      let q;
      if(officeId){
        q=query(collection(db,"clientes"),where("officeId","==",officeId),orderBy("createdAt","desc"));
      }else{
        q=query(collection(db,"clientes"),orderBy("createdAt","desc"));
      }
      const snap=await getDocs(q);
      setClientes(snap.docs.map(d=>({id:d.id,...d.data()})));
    }catch(e){
      // Fallback without orderBy if index not ready
      try{
        const{db,collection,getDocs,query,where}=window._firebase;
        const officeId=officeData?.id||userData?.officeId;
        const q=officeId?query(collection(db,"clientes"),where("officeId","==",officeId)):collection(db,"clientes");
        const snap=await getDocs(q);
        setClientes(snap.docs.map(d=>({id:d.id,...d.data()})));
      }catch(e2){console.error(e2);}
    }
    setLoading(false);
  };

  const loadTeam=async()=>{
    try{
      const{db,doc,getDoc}=window._firebase;
      const officeId=officeData?.id||userData?.officeId||"default";
      const snap=await getDoc(doc(db,"config",`equipo_${officeId}`));
      if(snap.exists())setEquipo(snap.data().miembros||[]);
    }catch(e){}
  };

  const loadBorradores=async()=>{
    setBorradoresLoading(true);
    try{
      const{db,collection,getDocs,query,orderBy,where}=window._firebase;
      const officeId=officeData?.id||userData?.officeId;
      let q;
      if(officeId){
        q=query(collection(db,"borradores"),where("officeId","==",officeId),orderBy("fechaEnvio","desc"));
      }else{
        q=query(collection(db,"borradores"),orderBy("fechaEnvio","desc"));
      }
      const snap=await getDocs(q);
      const all=snap.docs.map(d=>({id:d.id,...d.data()}));
      setBorradores(all);
      setBorradoresPendientes(all.filter(b=>b.estado==="borrador").length);
    }catch(e){
      try{
        const{db,collection,getDocs}=window._firebase;
        const snap=await getDocs(collection(db,"borradores"));

    const vencidos=clientes.filter(c=>getStatusCliente(c)==="vencido");
    const totalCobrar=clientes.reduce((s,c)=>(c.casos||[]).reduce((s2,ca)=>s2+getTotalProcesos(ca.procesos||[]),s),0);
    const totalCobrado=clientes.reduce((s,c)=>(c.casos||[]).reduce((s2,ca)=>s2+getTotalPagado(ca.procesos||[]),s),0);

    const sinPago=clientes.filter(c=>{const t=(c.casos||[]).reduce((s,ca)=>s+getTotalProcesos(ca.procesos||[]),0);const p=(c.casos||[]).reduce((s,ca)=>s+getTotalPagado(ca.procesos||[]),0);return t>0&&p===0;});
    return{alertas,vencidos,totalCobrar,totalCobrado,pendiente,eadElegibles,pagadoCompleto,conSaldo,sinPago};
  },[clientes]);

  const generatePDF=()=>{
    const{jsPDF}=window.jspdf;const pdfdoc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});

    const sLabel={vencido:"VENCIDA",hoy:"HOY",urgente:"URGENTE",proximo:"PROXIMA",ok:"AL DIA",pendiente:"PENDIENTE"};const sColor={vencido:[220,38,38],hoy:[234,88,12],urgente:[217,119,6],proximo:[37,99,235],ok:[22,163,74],pendiente:[107,114,128]};

      rows.push({row:[c.nombre||"—",c.paisOrigen||"—",fmtA(c.alienNum)||"—",sistemas,pf?fmt(pf):"—",dias===null?"—":dias<0?`Hace ${Math.abs(dias)}d`:dias===0?"HOY":`En ${dias}d`,sLabel[st]||"—",c.encargada||"—",totalP?fmtMoney(totalP):"—",pagadoP?fmtMoney(pagadoP):"—",pct!==null?`${pct}%`:"—"],status:st});
    });
    pdfdoc.autoTable({startY:26,head:[["Nombre","País","A#","Sistemas / Casos","Próx. fecha","Tiempo","Estado","Encargada","Total","Pagado","%"]],body:rows.map(r=>r.row),styles:{fontSize:7,cellPadding:2,overflow:"linebreak",valign:"middle"},headStyles:{fillColor:[30,64,175],textColor:255,fontStyle:"bold",fontSize:7.5},columnStyles:{0:{cellWidth:28},1:{cellWidth:16},2:{cellWidth:18},3:{cellWidth:50},4:{cellWidth:18},5:{cellWidth:13},6:{cellWidth:14},7:{cellWidth:20},8:{cellWidth:16},9:{cellWidth:16},10:{cellWidth:10}},alternateRowStyles:{fillColor:[248,250,252]},
    didParseCell:(data)=>{if(data.section==="body"&&data.column.index===6){const r=rows[data.row.index];if(r){const[rv,gv,bv]=sColor[r.status]||[107,114,128];data.cell.styles.textColor=[rv,gv,bv];data.cell.styles.fontStyle="bold";}}},margin:{left:4,right:4}});
    const pc=pdfdoc.internal.getNumberOfPages();for(let i=1;i<=pc;i++){pdfdoc.setPage(i);pdfdoc.setFontSize(7);pdfdoc.setTextColor(150,150,150);pdfdoc.text(`Pag ${i} de ${pc}  |  Confidencial`,4,pdfdoc.internal.pageSize.height-4);}
    pdfdoc.save(`reporte-${new Date().toISOString().slice(0,10)}.pdf`);setShowPDF(false);showToastFn(`PDF: ${datos.length} clientes ✓`);
  };

  if(authLoading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:16,color:"#6B7280"}}>⚖️ Cargando...</div>;

  return(<div style={{fontFamily:"'Segoe UI',Inter,sans-serif",minHeight:"100vh",background:"#F1F5F9"}}>

    {/* HEADER */}
    <div style={{background:"linear-gradient(135deg,#0F172A 0%,#1E40AF 100%)",padding:"18px 24px 0",color:"#fff"}}>
      <div style={{maxWidth:1080,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10,marginBottom:16}}>

            <p style={{margin:"3px 0 0",fontSize:12,opacity:0.65}}>🏢 {officeName} &nbsp;·&nbsp; 👤 {user.email}</p>

            const st=getStatusCliente(c);const scfg=STATUS_CONFIG[st];const pf=getProximaFecha(c);const dias=pf?getDias(pf):null;const exp=expandedId===c.id;
            const totalP=(c.casos||[]).reduce((s,ca)=>s+getTotalProcesos(ca.procesos||[]),0);
            const pagadoP=(c.casos||[]).reduce((s,ca)=>s+getTotalPagado(ca.procesos||[]),0);
            const pct=getPct(totalP,pagadoP);const pc=pagoColor(pct);
            const casoTab=activeCasoTab[c.id]||0;

                      {c.alienNum&&<span style={{fontSize:12,color:"#64748B"}}>🪪 <span style={{fontFamily:"monospace",fontWeight:600}}>{fmtA(c.alienNum)}</span></span>}
                      {c.telefono&&<span style={{fontSize:12,color:"#64748B"}}>📱 {c.telefono}</span>}

                  </div>

          ))}
        </div>
        <button onClick={()=>setShowTeam(false)} style={{width:"100%",padding:"10px",borderRadius:8,border:"1px solid #D1D5DB",background:"#fff",fontSize:14,cursor:"pointer",fontWeight:600}}>Cerrar</button>
      </div>
    </div>)}

    {/* MODAL PDF */}
    {showPDF&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:420,padding:28,boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
        <h2 style={{margin:"0 0 16px",fontSize:17,fontWeight:700}}>📄 Descargar PDF</h2>
        <div style={{background:"#F8FAFC",borderRadius:8,padding:"9px 13px",marginBottom:16,fontSize:13,color:"#475569"}}>📋 <strong>{filtered.length}</strong> clientes en el reporte</div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>setShowPDF(false)} style={{padding:"9px 20px",borderRadius:8,border:"1px solid #D1D5DB",background:"#fff",color:"#374151",fontSize:14,cursor:"pointer"}}>Cancelar</button>
          <button onClick={generatePDF} style={{padding:"9px 20px",borderRadius:8,border:"none",background:"#1E40AF",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>📥 Generar PDF</button>
        </div>
      </div>
    </div>)}

    {/* MODAL USUARIOS */}
    {showAddUser&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:400,padding:28,boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
        <h2 style={{margin:"0 0 16px",fontSize:17,fontWeight:700}}>🔐 Agregar usuario</h2>
        <Field label="Email" value={newUserEmail} onChange={setNewUserEmail} placeholder="usuario@email.com" type="email"/>
        <Field label="Contraseña temporal" value={newUserPass} onChange={setNewUserPass} placeholder="Mínimo 6 caracteres" type="password"/>
        {addUserMsg&&<div style={{padding:"9px 13px",borderRadius:8,background:addUserMsg.includes("✅")?"#F0FDF4":"#FEF2F2",border:`1px solid ${addUserMsg.includes("✅")?"#BBF7D0":"#FECACA"}`,fontSize:13,color:addUserMsg.includes("✅")?"#15803D":"#DC2626",marginBottom:14}}>{addUserMsg}</div>}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>{setShowAddUser(false);setAddUserMsg("");setNewUserEmail("");setNewUserPass("");}} style={{padding:"9px 20px",borderRadius:8,border:"1px solid #D1D5DB",background:"#fff",color:"#374151",fontSize:14,cursor:"pointer"}}>Cerrar</button>
          <button onClick={handleAddUser} style={{padding:"9px 20px",borderRadius:8,border:"none",background:"#1E40AF",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>Crear usuario</button>
        </div>
      </div>
    </div>)}

    {/* CONFIRMAR ELIMINAR */}
    {confirmDelete&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
      <div style={{background:"#fff",borderRadius:14,width:340,padding:28,textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:40}}>🗑️</div><h3 style={{margin:"10px 0 6px",color:"#0F172A"}}>¿Eliminar este cliente?</h3>
        <p style={{color:"#EF4444",fontSize:12,fontWeight:600,margin:"0 0 22px"}}>⚠️ Esta acción no se puede deshacer.</p>
        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          <button onClick={()=>setConfirmDelete(null)} style={{padding:"9px 22px",borderRadius:8,border:"1px solid #D1D5DB",background:"#fff",cursor:"pointer"}}>Cancelar</button>
          <button onClick={()=>handleDelete(confirmDelete)} style={{padding:"9px 22px",borderRadius:8,border:"none",background:"#EF4444",color:"#fff",cursor:"pointer",fontWeight:600}}>Sí, eliminar</button>
        </div>
      </div>
    </div>)}

    {/* TOAST */}
    {toast&&<div style={{position:"fixed",bottom:24,right:24,background:toast.type==="error"?"#EF4444":"#0F172A",color:"#fff",padding:"11px 18px",borderRadius:10,fontSize:14,fontWeight:500,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",zIndex:200}}>{toast.msg}</div>}
  </div>);
}

// ── Editor de Caso simplificado ──────────────────────────────────────────────
function CasoEditorSimple({caso,onChange,onDelete}){
  const sys=SISTEMAS[caso.sistema]||SISTEMAS.uscis;
  return(<div style={{background:"#F8FAFC",border:`2px solid ${sys.border}`,borderRadius:10,padding:"14px",marginBottom:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{display:"flex",gap:6}}>
        {Object.entries(SISTEMAS).map(([k,s])=>(
          <button key={k} onClick={()=>onChange({...caso,sistema:k,tipoCaso:""})} style={{padding:"5px 10px",borderRadius:7,border:caso.sistema===k?`2px solid ${s.color}`:"1px solid #E2E8F0",background:caso.sistema===k?s.bg:"#fff",color:caso.sistema===k?s.color:"#374151",fontWeight:caso.sistema===k?700:400,fontSize:12,cursor:"pointer"}}>{s.icon} {s.label}</button>
        ))}
      </div>
      <button onClick={onDelete} style={{background:"#FEF2F2",color:"#EF4444",border:"1px solid #FECACA",borderRadius:7,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>🗑 Eliminar</button>
    </div>
    <div style={{marginBottom:10}}>
      <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Tipo de caso</label>
      <select value={caso.tipoCaso} onChange={e=>onChange({...caso,tipoCaso:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,background:"#fff",cursor:"pointer"}}>
        <option value="">Seleccionar...</option>{SISTEMAS[caso.sistema].tiposCaso.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      {caso.sistema==="uscis"&&<><div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>N° Recibo</label><input value={caso.receiptNum||""} onChange={e=>onChange({...caso,receiptNum:e.target.value.toUpperCase()})} placeholder="IOE0912345678" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div></>}
      <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>A# Alien</label><input value={caso.alienNum||""} onChange={e=>onChange({...caso,alienNum:e.target.value.replace(/[^\d-]/g,"")})} placeholder="012-345-678" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>
      {caso.sistema==="eoir"&&<><div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Corte</label><input value={caso.corte||""} onChange={e=>onChange({...caso,corte:e.target.value})} placeholder="Miami Immigration Court" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div></>}
    </div>
    <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>📅 Fecha de {caso.sistema==="eoir"?"corte":caso.sistema==="foia"?"envío":"cita"}</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>
    {caso.sistema==="foia"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Tracking FOIA</label><input value={caso.foiaTracking||""} onChange={e=>onChange({...caso,foiaTracking:e.target.value})} placeholder="NRC2024123456" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>}
    <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Notas del caso</label><textarea value={caso.nota||""} onChange={e=>onChange({...caso,nota:e.target.value})} placeholder="Observaciones..." rows={2} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,resize:"vertical",outline:"none"}}/></div>
    <ProcesosEditor procesos={caso.procesos||[]} onChange={v=>onChange({...caso,procesos:v})}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
