//  Helpers 
function getStatus(f){if(!f)return"pendiente";const h=new Date();h.setHours(0,0,0,0);const d=Math.round((new Date(f+"T00:00:00")-h)/86400000);if(d<0)return"vencido";if(d===0)return"hoy";if(d<=3)return"urgente";if(d<=14)return"proximo";return"ok";}
function getDias(f){if(!f)return null;const h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(f+"T00:00:00")-h)/86400000);}
function fmt(f){if(!f)return"—";const[y,m,d]=f.split("-");return`${m}/${d}/${y}`;}
function fmtA(a){const c=(a||"").replace(/\D/g,"").slice(0,9);if(c.length<=3)return c;if(c.length<=6)return c.slice(0,3)+"-"+c.slice(3);return c.slice(0,3)+"-"+c.slice(3,6)+"-"+c.slice(6);}
function eoirUrl(a){return`https://acis.eoir.justice.gov/en/CaseInformation?caseNumber=${(a||"").replace(/\D/g,"")}`;}
function uscisUrl(r){return`https://egov.uscis.gov/casestatus/mycasestatus.do?appReceiptNum=${(r||"").replace(/\s/g,"")}`;}
function fmtMoney(v){if(!v&&v!==0)return"";const n=parseFloat(v.toString().replace(/[^0-9.]/g,""));if(isNaN(n))return"";return"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseMoney(v){return parseFloat((v||"0").toString().replace(/[^0-9.]/g,""))||0;}
function getPct(total,pagado){if(!total)return null;return Math.min(100,Math.round((pagado/total)*100));}
function pagoColor(pct){if(pct===null)return"#6B7280";if(pct>=100)return"#16A34A";if(pct>=50)return"#D97706";return"#DC2626";}
function getTotalProcesos(procesos){return(procesos||[]).reduce((s,p)=>s+parseMoney(p.precio),0);}
function getTotalPagado(procesos){return(procesos||[]).reduce((s,p)=>s+parseMoney(p.pagado),0);}
function getWPTotal(ca){return((ca&&ca.wpDependientes)||[]).reduce((s,w)=>s+parseMoney(w.precio),0);}
function getWPPagado(ca){return((ca&&ca.wpDependientes)||[]).reduce((s,w)=>s+parseMoney(w.pagado),0);}
function getTotalCaso(ca){return getTotalProcesos((ca&&ca.procesos)||[])+getWPTotal(ca);}
function getPagadoCaso(ca){return getTotalPagado((ca&&ca.procesos)||[])+getWPPagado(ca);}
function getPróximaFecha(cliente){const fechas=[];(cliente.casos||[]).forEach(c=>{if(c.fechaCorte)fechas.push(c.fechaCorte);if(c.fechaHuellas)fechas.push(c.fechaHuellas);});if(!fechas.length)return null;const hoy=new Date();hoy.setHours(0,0,0,0);const futuras=fechas.filter(f=>new Date(f+"T00:00:00")>=hoy).sort();if(futuras.length)return futuras[0];return fechas.sort().reverse()[0];}
function getStatusCliente(cliente){const pf=getPróximaFecha(cliente);if(!pf)return"pendiente";return getStatus(pf);}

function ProcesosEditor({procesos,onChange}){
  const add=()=>onChange([...procesos,{nombre:"",precio:"",pagado:"",notas:"",id:Date.now()}]);
  const upd=(i,f,v)=>{const n=[...procesos];n[i]={...n[i],[f]:v};onChange(n);};
  const del=(i)=>onChange(procesos.filter((_,idx)=>idx!==i));
  const total=getTotalProcesos(procesos);const pagado=getTotalPagado(procesos);const pct=getPct(total,pagado);const pc=pagoColor(pct);
  return(<div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"12px",marginBottom:10}}>

            <option value="">Seleccionar proceso...</option>{PROCESOS_COMUNES.map(pc=><option key={pc} value={pc}>{pc}</option>)}

function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const[loginLogo,setLoginLogo]=useState(window._officeLogo||null);
  const[loginName,setLoginName]=useState(window._officeName||null);
  useEffect(()=>{
    window._forceLoginUpdate=()=>{setLoginLogo(window._officeLogo||null);setLoginName(window._officeName||null);};
    return()=>{window._forceLoginUpdate=null;};
  },[]);
  const login=async()=>{if(!email||!pw){setErr("Ingresa tu email y contraseña");return;}setLoading(true);setErr("");
    try{
      const{auth,signInWithEmailAndPassword,db,doc,getDoc}=window._firebase;
      const cred=await signInWithEmailAndPassword(auth,email,pw);
      const userDoc=await getDoc(doc(db,"users",cred.user.uid));
      if(!userDoc.exists())throw new Error("Usuario no encontrado");
      const userData=userDoc.data();
      if(!["office_admin","employee","superadmin"].includes(userData.role))throw new Error("Sin acceso");
      // Get office data
      let officeInfo=null;
      if(userData.officeId){
        const officeDoc=await getDoc(doc(db,"offices",userData.officeId));
        if(officeDoc.exists()){
              const od3=officeDoc.data();
              officeInfo={id:officeDoc.id,...od3};
              if(od3.logoUrl){setOfficeLogo(od3.logoUrl);window._officeLogo=od3.logoUrl;}
              if(od3.enabledModules&&od3.enabledModules.length>0)setEnabledModules(od3.enabledModules);
            }
      }
      // Entrar primero (el login no debe esperar por el registro de actividad)
      onLogin(cred.user,userData,officeInfo);
      // Registrar actividad de login en segundo plano (si falla, no afecta el acceso)
      try{
        const{collection:colA,addDoc:addA}=window._firebase;
        addA(colA(db,"actividadEmpleadas"),{
          officeId:userData.officeId||"",
          usuario:cred.user.email,
          tipo:"login",
          detalle:"Inició sesión",
          fecha:new Date().toISOString(),
        }).catch(ae=>console.error("Error registrando login:",ae));
      }catch(ae){console.error("Error registrando login:",ae);}
    }catch(e){
      const code=e.code||"";
      if(code.includes("wrong-password")||code.includes("user-not-found")||code.includes("invalid-credential")||code.includes("invalid-email")){
        setErr("Email o contraseña incorrectos");
      } else if(e.message==="Sin acceso"){
        setErr("Esta cuenta no tiene acceso al monitor");
      } else if(e.message==="Usuario no encontrado"){
        setErr("Usuario no encontrado en el sistema");
      } else {
        // Error no relacionado con credenciales (ej. registro de actividad): no bloquear
        console.error("Login (no credencial):",e);
        setErr("");
      }
    }
    setLoading(false);};
  return(<div onClick={()=>setOpenMenuId(null)} style={{minHeight:"100vh",background:"linear-gradient(135deg,#0F172A 0%,#1E40AF 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:400,padding:36,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{marginBottom:12,display:"flex",justifyContent:"center"}}>
          {loginLogo
            ?<img src={loginLogo} alt="Logo" style={{height:70,maxWidth:220,objectFit:"contain",borderRadius:10}}/>
            :<div style={{fontSize:48}}>⚖️</div>
          }
        </div>
        <h1 style={{fontSize:22,fontWeight:800,color:"#0F172A",margin:0}}>{loginName||t("Monitor de Inmigración","Immigration Monitor")}</h1>
        <p style={{fontSize:13,color:"#64748B",marginTop:6}}>{t("Ingresa con tu cuenta para continuar","Sign in to continue")}</p>
      </div>
      <div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>{t("Email","Email")}</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" onKeyDown={e=>e.key==="Enter"&&login()} style={{width:"100%",padding:"11px 13px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/></div>
      <div style={{marginBottom:20}}><label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>{t("Contraseña","Password")}</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&login()} style={{width:"100%",padding:"11px 13px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/></div>
      {err&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#DC2626",marginBottom:16}}>⚠️ {err}</div>}
      <button onClick={login} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:9,border:"none",background:loading?"#E5E7EB":"#1E40AF",color:loading?"#9CA3AF":"#fff",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer"}}>{loading ? t("Ingresando...","Signing in...") : t("Ingresar →","Sign in →")}</button>
    </div></div>);
}

const TIPOS_DOC = [
  "🪪 Pasaporte",
  "🔒 Social Security",
  "📄 Permiso de trabajo / EAD",
  "🚗 Licencia de conducir",
  "🌎 Visa",
  "🛬 I-94",
  "🫵 Tarjeta consular",
  "📋 I-9 / W-4",
  "🔵 Huellas (Biométricos)",
  "📬 Recibo USCIS",
  "🔢 Tracking Number",
  "💳 EAD Card",
  "📨 Notice of Action",
  "📃 Carta de decisión",
  "📸 Fotos migratorias",
  "📃 Otro documento"
];

function DocPanel({clienteId, clienteNombre, officeData, userData, docsCliente, setDocsCliente, uploadingDoc, setUploadingDoc, uploadProgress, setUploadProgress, showToastFn}){
  const [tipoSeleccionado, setTipoSeleccionado] = React.useState(TIPOS_DOC[0]);
  const [notaDoc, setNotaDoc] = React.useState("");
  const [fechaVence, setFechaVence] = React.useState("");
  const [confirmEliminar, setConfirmEliminar] = React.useState(null);
  const docs = docsCliente[clienteId] || [];
  const uploading = uploadingDoc[clienteId] || false;
  const progress = uploadProgress[clienteId] || 0;

  async function cargarDocs(){
    const {db, collection, query, where, getDocs} = window._firebase;
    const officeId = officeData?.id || userData?.officeId;
    try {
      const q = query(collection(db,"documentos_clientes"), where("clienteId","==",clienteId), where("officeId","==",officeId));
      const snap = await getDocs(q);
      const lista = snap.docs.map(d=>({id:d.id,...d.data()}));
      setDocsCliente(prev=>({...prev,[clienteId]:lista}));
    } catch(e){ console.error("cargarDocs error:",e.message); showToastFn("❌ Error cargando docs: "+e.message); }
  }

  React.useEffect(()=>{ if(!docsCliente[clienteId]) cargarDocs(); },[clienteId]);

  async function subirDocumento(e){
    const archivo = e.target.files[0];
    if(!archivo) return;
    const maxSize = 10 * 1024 * 1024;
    if(archivo.size > maxSize){ showToastFn("❌ El archivo excede 10MB"); return; }
    const {storage, ref, uploadBytesResumable, getDownloadURL, db, collection, addDoc} = window._firebase;
    const officeId = officeData?.id || userData?.officeId;
    const path = `documentos/${officeId}/${clienteId}/${Date.now()}_${archivo.name}`;
    const storageRef = ref(storage, path);
    setUploadingDoc(prev=>({...prev,[clienteId]:true}));
    setUploadProgress(prev=>({...prev,[clienteId]:0}));
    const uploadTask = uploadBytesResumable(storageRef, archivo);
    uploadTask.on("state_changed",
      snap=>{ const pct = Math.round((snap.bytesTransferred/snap.totalBytes)*100); setUploadProgress(prev=>({...prev,[clienteId]:pct})); },
      err=>{ showToastFn("❌ Error al subir: "+err.message); setUploadingDoc(prev=>({...prev,[clienteId]:false})); },
      async ()=>{
        try{
          const url = await getDownloadURL(uploadTask.snapshot.ref);
          const {db, collection, addDoc} = window._firebase;
          await addDoc(collection(db,"documentos_clientes"),{
            officeId, clienteId,
            clienteNombre: clienteNombre||"",
            nombre: archivo.name,
            tipo: tipoSeleccionado,
            nota: notaDoc||"",
            url, path,
            tamaño: archivo.size,
            createdAt: new Date().toISOString(),
            subidoPor: window._firebase.auth.currentUser?.email||""
          });
          setUploadingDoc(prev=>({...prev,[clienteId]:false}));
          setNotaDoc("");
          showToastFn("✅ Documento subido correctamente");
          e.target.value="";
          // Reload docs
          const officeId2 = officeData?.id || userData?.officeId;
          const q2 = window._firebase.query(collection(db,"documentos_clientes"), window._firebase.where("clienteId","==",clienteId), window._firebase.where("officeId","==",officeId2));
          const snap2 = await window._firebase.getDocs(q2);
          const lista = snap2.docs.map(d=>({id:d.id,...d.data()}));
          setDocsCliente(prev=>({...prev,[clienteId]:lista}));
        }catch(err2){
          showToastFn("❌ Error al guardar: "+err2.message);
          setUploadingDoc(prev=>({...prev,[clienteId]:false}));
        }
      }
    );
  }

  async function eliminarDoc(docData){
    const {storage, ref, deleteObject, db, doc, deleteDoc} = window._firebase;
    try {
      if(docData.path){ const sRef = ref(storage, docData.path); await deleteObject(sRef).catch(()=>{}); }
      await deleteDoc(doc(db,"documentos_clientes",docData.id));
      showToastFn("🗑️ Documento eliminado");
      setConfirmEliminar(null);
      cargarDocs();
    } catch(e){ showToastFn("❌ Error: "+e.message); }
  }

  const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+"MB" : (b/1024).toFixed(0)+"KB";
  const fmtFecha = f => { if(!f) return null; const d=new Date(f+"T00:00:00"); return d.toLocaleDateString("es-US",{day:"2-digit",month:"short",year:"numeric"}); };
  const hoy = new Date().toISOString().slice(0,10);
  const vencidos = docs.filter(d=>d.fechaVence&&d.fechaVence<hoy);
  const porVencer = docs.filter(d=>{if(!d.fechaVence||d.fechaVence<hoy)return false; const diff=(new Date(d.fechaVence)-new Date())/(86400000); return diff<=30;});

  return(
    <div style={{padding:"16px 20px"}}>

      {/* Alertas de vencimiento */}
      {vencidos.length>0&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:"#991B1B"}}>
        🔴 <strong>{vencidos.length} documento(s) vencido(s):</strong> {vencidos.map(d=>d.tipo).join(", ")}
      </div>}
      {porVencer.length>0&&<div style={{background:"#FEF9C3",border:"1px solid #FDE047",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:"#854D0E"}}>
        ⚠️ <strong>{porVencer.length} documento(s) por vencer (30 días):</strong> {porVencer.map(d=>d.tipo).join(", ")}
      </div>}

      {/* Subir documento */}
      <div style={{background:"#F8FAFC",border:"1px dashed #CBD5E1",borderRadius:10,padding:"14px 16px",marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:10}}>📤 Subir nuevo documento</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1.5fr",gap:10,marginBottom:10}}>
          <div>
            <label style={{fontSize:11,color:"#64748B",fontWeight:600,display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:".4px"}}>Tipo de documento</label>
            <select value={tipoSeleccionado} onChange={e=>setTipoSeleccionado(e.target.value)} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:12,background:"#fff",outline:"none"}}>
              {TIPOS_DOC.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:11,color:"#64748B",fontWeight:600,display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:".4px"}}>Nota (opcional)</label>
            <textarea value={notaDoc} onChange={e=>setNotaDoc(e.target.value)} placeholder="Ej. Pasaporte vence en 2027, número A123456789..." style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:12,outline:"none",resize:"none",height:72,fontFamily:"inherit"}}/>
          </div>
        </div>
        {uploading?(
          <div style={{marginTop:8}}>
            <div style={{fontSize:11,color:"#6366F1",marginBottom:4}}>⬆️ Subiendo... {progress}%</div>
            <div style={{background:"#E0E7FF",borderRadius:4,height:6}}><div style={{background:"#6366F1",height:6,borderRadius:4,width:progress+"%",transition:"width .3s"}}></div></div>
          </div>
        ):(
          <label style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",background:"#1E2D5A",color:"#fff",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            📎 Seleccionar archivo (PDF, JPG, PNG — máx. 10MB)
            <input type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style={{display:"none"}} onChange={subirDocumento}/>
          </label>
        )}
      </div>

      {/* Lista de documentos */}
      {docs.length===0?(
        <div style={{textAlign:"center",padding:"24px",color:"#94A3B8",fontSize:13}}>
          📂 No hay documentos subidos todavía para este cliente.
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:4}}>{docs.length} DOCUMENTO(S) REGISTRADO(S)</div>
          {docs.map(d=>{
            const vencido = d.fechaVence&&d.fechaVence<hoy;
            const proxVencer = d.fechaVence&&!vencido&&(new Date(d.fechaVence)-new Date())/(86400000)<=30;
            return(
              <div key={d.id} style={{background:"#fff",border:`1px solid ${vencido?"#FECACA":proxVencer?"#FDE047":"#E2E8F0"}`,borderRadius:9,padding:"10px 14px",display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:22,flexShrink:0}}>{d.tipo?.split(" ")[0]||"📄"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,color:"#0F172A"}}>{d.tipo}</div>
                  <div style={{fontSize:11,color:"#64748B"}}>{d.nombre} · {fmtSize(d.tamaño||0)}</div>
                  {d.nota&&<div style={{fontSize:11,color:"#94A3B8",fontStyle:"italic"}}>💬 {d.nota}</div>}
                  {d.fechaVence&&<div style={{fontSize:11,fontWeight:600,color:vencido?"#DC2626":proxVencer?"#D97706":"#16A34A"}}>
                    {vencido?"🔴 Vencido":"proxVencer"?"⚠️ Vence pronto":"✅ Vigente"}: {fmtFecha(d.fechaVence)}
                  </div>}
                  <div style={{fontSize:10,color:"#CBD5E1"}}>Subido por {d.subidoPor}</div>
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <a href={d.url} target="_blank" rel="noopener noreferrer" style={{padding:"5px 10px",background:"#EFF6FF",color:"#1D4ED8",borderRadius:6,fontSize:11,fontWeight:600,textDecoration:"none",border:"1px solid #BFDBFE"}}>👁️ Ver</a>
                  <button onClick={()=>{
                      const {storage,ref:sref,getDownloadURL}=window._firebase;
                      const doDownload=(url)=>{
                        const xhr=new XMLHttpRequest();
                        xhr.responseType="blob";
                        xhr.onload=()=>{
                          const burl=URL.createObjectURL(xhr.response);
                          const a=document.createElement("a");
                          a.href=burl;
                          a.download=d.nombre||"documento";
                          document.body.appendChild(a);
                          a.click();
                          setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(burl);},3000);
                          showToastFn("✅ Descarga iniciada","success");
                        };
                        xhr.onerror=()=>{window.open(url,"_blank");showToastFn("Abriendo en nueva pestaña — Ctrl+S para guardar","info");};
                        xhr.open("GET",url);
                        xhr.send();
                      };
                      if(d.path){
                        getDownloadURL(sref(storage,d.path)).then(doDownload).catch(()=>doDownload(d.url));
                      } else {
                        doDownload(d.url);
                      }
                    }} style={{padding:"5px 10px",background:"#F0FDF4",color:"#16A34A",borderRadius:6,fontSize:11,fontWeight:600,border:"1px solid #BBF7D0",cursor:"pointer"}}>⬇️ Descargar</button>
                  <button onClick={()=>setConfirmEliminar(d)} style={{padding:"5px 10px",background:"#FEF2F2",color:"#DC2626",borderRadius:6,fontSize:11,fontWeight:600,border:"1px solid #FECACA",cursor:"pointer"}}>🗑️</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Confirmar eliminación */}
      {confirmEliminar&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999}}>
          <div style={{background:"#fff",borderRadius:12,padding:"24px",maxWidth:380,width:"90%",textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:12}}>🗑️</div>
            <div style={{fontSize:15,fontWeight:700,marginBottom:6}}>¿Eliminar documento?</div>
            <div style={{fontSize:13,color:"#64748B",marginBottom:20}}>"{confirmEliminar.tipo}" — Esta acción no se puede deshacer.</div>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button onClick={()=>setConfirmEliminar(null)} style={{padding:"8px 18px",background:"#F1F5F9",border:"none",borderRadius:7,cursor:"pointer",fontSize:13,fontWeight:600}}>Cancelar</button>
              <button onClick={()=>eliminarDoc(confirmEliminar)} style={{padding:"8px 18px",background:"#DC2626",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontSize:13,fontWeight:600}}>Sí, eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const assignExpedientes=async()=>{
  try{
    const{db,collection,getDocs,query,where,updateDoc,doc}=window._firebase;
    const officeId=officeData?.id||userData?.officeId;
    let q;
    if(officeId){
      q=query(collection(db,"clientes"),where("officeId","==",officeId));
    }else{
      q=collection(db,"clientes");
    }
    const snap=await getDocs(q);
    const sorted=snap.docs.slice().sort((a,b)=>{
      const fa=a.data().createdAt||"";
      const fb=b.data().createdAt||"";
      return fa.localeCompare(fb);
    });
    let maxNum=sorted.reduce((max,d)=>{
      const n=parseInt((d.data().expediente||"").replace("EXP-",""))||0;
      return n>max?n:max;
    },0);
    const sinExp=sorted.filter(d=>!d.data().expediente);
    for(const d of sinExp){
      maxNum++;
      const expNum="EXP-"+String(maxNum).padStart(4,"0");
      await updateDoc(doc(db,"clientes",d.id),{expediente:expNum});
    }
    await loadCases();
    showToastFn(`Expedientes asignados — ${sinExp.length} clientes actualizados ✓`);
  }catch(e){console.error("assignExpedientes error:",e);showToastFn("Error: "+e.message,"error");}
};

const loadTeam=async()=>{
    try{
      const{db,doc,getDoc}=window._firebase;
      const officeId=officeData?.id||userData?.officeId||"default";
      const snap=await getDoc(doc(db,"config",`equipo_${officeId}`));
      if(snap.exists())setEquipo(snap.data().miembros||[]);
    }catch(e){}
  };
  const loadActividad=async()=>{
    setActividadLoading(true);
    try{
      const{db,collection,getDocs,query,where,orderBy}=window._firebase;
      const officeId=officeData?.id||userData?.officeId||"default";
      const diaInicio=new Date(actividadFecha+"T00:00:00").toISOString();
      const diaFin=new Date(actividadFecha+"T23:59:59").toISOString();

      // 1. Eventos de login del día
      let loginEvents=[];
      try{
        const qLogin=query(collection(db,"actividadEmpleadas"),where("officeId","==",officeId));
        const snapLogin=await getDocs(qLogin);
        loginEvents=snapLogin.docs.map(d=>({id:d.id,...d.data()}))
          .filter(ev=>ev.fecha>=diaInicio&&ev.fecha<=diaFin)
          .map(ev=>({tipo:"login",usuario:ev.usuario,detalle:ev.detalle||"Inició sesión",fecha:ev.fecha,icono:"🔓"}));
      }catch(e){console.error("loadActividad login error:",e);}

      // 2. Cambios en clientes (historial) — filtrar por oficina y por fecha
      let historialEvents=[];
      try{
        const qHist=query(collection(db,"historial"),where("officeId","==",officeId));
        const snapHist=await getDocs(qHist);
        historialEvents=snapHist.docs.map(d=>({id:d.id,...d.data()}))
          .filter(ev=>ev.fecha>=diaInicio&&ev.fecha<=diaFin)
          .map(ev=>({
            tipo:"cambio",
            usuario:ev.usuarioEmail||ev.usuario||"",
            detalle:ev.accion||(ev.cambios&&ev.cambios.length>0?ev.cambios[0].texto:"Cambio realizado"),
            clienteId:ev.clienteId,
            fecha:ev.fecha,
            icono:"✏️",
          }));
      }catch(e){console.error("loadActividad historial error:",e);}

      // 3. Estado online (heartbeats recientes)
      let onlineList=[];
      try{
        const qOnline=query(collection(db,"actividadOnline"),where("officeId","==",officeId));
        const snapOnline=await getDocs(qOnline);
        onlineList=snapOnline.docs.map(d=>({id:d.id,...d.data()}));
      }catch(e){console.error("loadActividad online error:",e);}

      const allEvents=[...loginEvents,...historialEvents].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
      setActividadData(allEvents);
      setActividadOnline(onlineList);
    }catch(e){console.error("loadActividad error:",e);}
    setActividadLoading(false);
  };


  const loadOfficeUsers=async()=>{
    try{
      const{db,collection,getDocs,query,where}=window._firebase;
      const officeId=officeData?.id||userData?.officeId||"";
      if(!officeId)return;
      const q=query(collection(db,"users"),where("officeId","==",officeId));
      const snap=await getDocs(q);
      const users=snap.docs.map(d=>({id:d.id,...d.data()}));
      // Exclude the current admin
      setOfficeUsers(users.filter(u=>u.email!==user.email));
    }catch(e){console.error("loadOfficeUsers:",e);}
  };

  const handleDeleteUser=async(u)=>{
    try{
      const{db,doc,deleteDoc,setDoc}=window._firebase;
      // 1. Delete Firestore user document (revokes access immediately)
      await deleteDoc(doc(db,"users",u.id));
      // 2. Remove from equipo list
      const officeId=officeData?.id||userData?.officeId||"";
      const newEquipo=equipo.filter(m=>m!==u.displayName);
      await setDoc(doc(db,"config",`equipo_${officeId}`),{miembros:newEquipo});
      setEquipo(newEquipo);
      // 3. Update local state
      setOfficeUsers(prev=>prev.filter(x=>x.id!==u.id));
      setConfirmDeleteUser(null);
      showToastFn(t(`Acceso de ${u.displayName} eliminado ✓`,`Access for ${u.displayName} removed ✓`));
    }catch(e){
      showToastFn("❌ Error: "+e.message);
      setConfirmDeleteUser(null);
    }
  };

  const loadBorradores=async()=>{
    setBorradoresLoading(true);
    try{
      const{db,collection,getDocs,query,orderBy,where}=window._firebase;
      const officeId=officeData?.id||userData?.officeId;
      let q;
      if(officeId){
        q=query(collection(db,"borradores"),where("officeId","==",officeId),orderBy("fechaEnvio","desc"));

  const guardarCasoUscis=async()=>{
    const recibo=(uscisForm.recibo||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!/^[A-Z]{3}[0-9]{10}$/.test(recibo)){showToastFn(t("El recibo debe tener 3 letras + 10 números (ej: IOE1234567890)","Receipt must be 3 letters + 10 digits (e.g. IOE1234567890)"),"error");return;}
    const estatusFinal=uscisForm.estatus==="__otro__"?(uscisForm.estatusOtro||"").trim():uscisForm.estatus;
    if(!estatusFinal){showToastFn(t("Selecciona el estatus actual del caso","Select the current case status"),"error");return;}
    setUscisSaving(true);
    try{
      const{db,collection,addDoc,updateDoc,doc}=window._firebase;
      const officeId=officeData?.id||userData?.officeId||"";
      const ahora=new Date().toISOString();
      const por=userData?.displayName||user?.email||"";
      const cliente=uscisForm.clienteId?clientes.find(c=>c.id===uscisForm.clienteId):null;
      const existente=casosUscis.find(c=>c.recibo===recibo);
      if(existente){
        const cambios={formulario:uscisForm.formulario,nota:uscisForm.nota||"",clienteId:uscisForm.clienteId||existente.clienteId||"",clienteNombre:cliente?cliente.nombre:(existente.clienteNombre||""),updatedAt:ahora,revisadoAt:ahora,revisadoPor:por};
        if(estatusFinal!==existente.estatus){
          cambios.estatus=estatusFinal;
          cambios.historial=[...(existente.historial||[]),{estatus:estatusFinal,fecha:ahora,por}];
        }
        await updateDoc(doc(db,"casos_uscis",existente.id),cambios);
        showToastFn(t("Caso actualizado ✓","Case updated ✓"));
        registrarActividad("uscis",t("Caso USCIS actualizado","USCIS case updated"),`${recibo} · ${estatusFinal}`);
      }else{
        await addDoc(collection(db,"casos_uscis"),{officeId,recibo,formulario:uscisForm.formulario,estatus:estatusFinal,nota:uscisForm.nota||"",clienteId:uscisForm.clienteId||"",clienteNombre:cliente?cliente.nombre:"",historial:[{estatus:estatusFinal,fecha:ahora,por}],createdAt:ahora,updatedAt:ahora,revisadoAt:ahora,revisadoPor:por});
        showToastFn(t("Caso guardado ✓","Case saved ✓"));
        registrarActividad("uscis",t("Caso USCIS registrado","USCIS case added"),`${recibo} · ${estatusFinal}`);
      }
      setUscisForm({recibo:"",formulario:"I-765 Permiso de trabajo",estatus:"",estatusOtro:"",nota:"",clienteId:""});

                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Buscar caso o cliente","Find case or client")}</label>
                    <select value={envioForm.clienteId} onChange={e=>setEnvioForm(f=>({...f,clienteId:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none",background:"#fff"}}>
                      <option value="">{t("— Sin vincular —","— Not linked —")}</option>
                      {clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Destinatario","Recipient")}</label>
                    <select value={envioForm.destinatario} onChange={e=>setEnvioForm(f=>({...f,destinatario:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none",background:"#fff"}}>
                      {DESTINATARIOS_ENVIO.map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                    {envioForm.destinatario==="Otro"&&<input value={envioForm.destinatarioOtro} onChange={e=>setEnvioForm(f=>({...f,destinatarioOtro:e.target.value}))} placeholder={t("¿A quién?","To whom?")} style={{width:"100%",marginTop:5,padding:"7px 10px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:12,outline:"none"}}/>}
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Estado","Status")}</label>
                    <select value={envioForm.estado} onChange={e=>setEnvioForm(f=>({...f,estado:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none",background:"#fff"}}>
                      {ESTADOS_ENVIO.map(s=><option key={s.id} value={s.id}>{s.icon} {s.id}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Fecha de envío","Ship date")}</label>
                    <input type="date" value={envioForm.fechaEnvio} onChange={e=>setEnvioForm(f=>({...f,fechaEnvio:e.target.value}))} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Fecha de entrega","Delivery date")}</label>
                    <input type="date" value={envioForm.fechaEntrega} onChange={e=>setEnvioForm(f=>({...f,fechaEntrega:e.target.value}))} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/>
                  </div>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Documentos enviados","Documents sent")}</label>
                  <input value={envioForm.documentos} onChange={e=>setEnvioForm(f=>({...f,documentos:e.target.value}))} placeholder={t("Ej: Paquete I-589, evidencias y copias","E.g.: I-589 packet, evidence and copies")} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/>
                </div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button onClick={guardarEnvio} disabled={envioSaving} style={{background:"#0C447C",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:700,cursor:"pointer",opacity:envioSaving?0.6:1}}>{envioSaving?t("Guardando...","Saving..."):t("Guardar envío 💾","Save shipment 💾")}</button>
                  {envioSel&&envioSel.comprobanteUrl&&<button onClick={()=>window.open(envioSel.comprobanteUrl,"_blank")} style={{background:"#fff",color:"#0C447C",border:"1px solid #0C447C",borderRadius:8,padding:"9px 16px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{t("Ver comprobante ↗","View proof ↗")}</button>}
                </div>
              </div>

              {/* ── Tarjeta del envío seleccionado ── */}
              {envioSel&&(
                <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:12,padding:16,marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:22}}>📦</span>
                      <div>
                        <div style={{fontSize:14,fontWeight:800,color:"#0F172A",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          {(envioSel.documentos||t("Paquete","Package"))+" → "+envioSel.destinatario}
                          <span style={{background:colorEstadoEnvio(envioSel.estado)+"22",color:colorEstadoEnvio(envioSel.estado),fontSize:11,fontWeight:700,padding:"2px 10px",borderRadius:99}}>{envioSel.estado}</span>
                        </div>
                        <div style={{fontSize:11,color:"#94A3B8"}}>{t("Actualizado el","Updated")} {envioSel.updatedAt?new Date(envioSel.updatedAt).toLocaleString():""}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      {envioSel.comprobanteUrl&&<button onClick={()=>window.open(envioSel.comprobanteUrl,"_blank")} style={{background:"#fff",color:"#0C447C",border:"1px solid #0C447C",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>{t("Abrir comprobante ↗","Open proof ↗")}</button>}
                      <button onClick={()=>setEnvioForm({tracking:envioSel.tracking,metodo:envioSel.metodo,destinatario:DESTINATARIOS_ENVIO.includes(envioSel.destinatario)?envioSel.destinatario:"Otro",destinatarioOtro:DESTINATARIOS_ENVIO.includes(envioSel.destinatario)?"":envioSel.destinatario,documentos:envioSel.documentos||"",estado:envioSel.estado,clienteId:envioSel.clienteId||"",fechaEnvio:envioSel.fechaEnvio||"",fechaEntrega:envioSel.fechaEntrega||""})} style={{background:"#F1F5F9",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>✏️ {t("Actualizar","Update")}</button>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:1,background:"#E2E8F0",border:"1px solid #E2E8F0",borderRadius:10,overflow:"hidden"}}>
                    {[
                      ["📅",t("Fecha de envío","Ship date"),fmtFecha(envioSel.fechaEnvio)],
                      ["🚚",t("Método","Carrier"),envioSel.metodo],
                      ["🔢",t("Tracking number","Tracking number"),envioSel.tracking],
                      ["🏛️",t("Destinatario","Recipient"),envioSel.destinatario],
                      ["📄",t("Documentos enviados","Documents sent"),envioSel.documentos||"—"],
                      ["📬",t("Fecha de entrega","Delivery date"),fmtFecha(envioSel.fechaEntrega)],
                      ["☁️",t("Comprobante subido","Proof uploaded"),envioSel.comprobanteUrl?t("Sí, subido","Yes, uploaded"):t("No subido","Not uploaded")],
                      ["👤",t("Responsable","Responsible"),envioSel.responsable||"—"],
                    ].map(([ic,lab,val],i)=>(
                      <div key={i} style={{background:"#fff",padding:"10px 12px"}}>
                        <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",textTransform:"uppercase",display:"flex",alignItems:"center",gap:4}}>{ic} {lab}</div>
                        <div style={{fontSize:13,fontWeight:600,color:"#0F172A",marginTop:2,wordBreak:"break-word"}}>{val}</div>
                      </div>
                    ))}
                  </div>
                  {envioSel.clienteNombre&&<div style={{marginTop:8,fontSize:12,color:"#1D4ED8"}}>👤 {t("Cliente vinculado","Linked client")}: {envioSel.clienteNombre}</div>}
                </div>
              )}

              {/* ── Historial + Envíos recientes ── */}
              <div style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:14}}>
                <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:12,padding:14}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:10}}>{t("Historial de tracking","Tracking history")}</div>
                  {!envioSel||!(envioSel.historial||[]).length?<div style={{fontSize:12,color:"#94A3B8"}}>{t("Sin historial aún","No history yet")}</div>:
                    [...(envioSel.historial||[])].reverse().map((h,i,arr)=>(
                      <div key={i} style={{display:"flex",gap:8}}>
                        <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                          <span style={{fontSize:13,lineHeight:"16px"}}>{iconEstadoEnvio(h.estado)}</span>
                          {i<arr.length-1&&<span style={{width:2,flex:1,background:"#E2E8F0",minHeight:14}}></span>}
                        </div>
                        <div style={{paddingBottom:10}}>
                          <div style={{fontSize:12,fontWeight:i===0?700:500,color:"#0F172A"}}>{h.estado}{i===0&&<span style={{background:"#DCFCE7",color:"#166534",fontSize:9,fontWeight:700,padding:"1px 7px",borderRadius:99,marginLeft:6}}>{t("Actual","Current")}</span>}</div>
                          <div style={{fontSize:10,color:"#94A3B8"}}>{h.fecha?new Date(h.fecha).toLocaleString():""}</div>
                        </div>
                      </div>
                    ))}
                </div>
                <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:12,padding:14}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:10}}>{t("Envíos recientes","Recent shipments")}</div>
                  {enviosLoading?<div style={{fontSize:12,color:"#94A3B8",padding:12}}>{t("Cargando...","Loading...")}</div>:
                   enviosList.length===0?<div style={{fontSize:12,color:"#94A3B8",padding:12}}>{t("Aún no hay envíos registrados.","No shipments yet.")}</div>:(
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{color:"#94A3B8",textAlign:"left",fontSize:10,textTransform:"uppercase"}}>
                          <th style={{padding:"6px 8px"}}>{t("Caso","Case")}</th><th style={{padding:"6px 8px"}}>{t("Método","Carrier")}</th><th style={{padding:"6px 8px"}}>Tracking</th><th style={{padding:"6px 8px"}}>{t("Estado","Status")}</th><th style={{padding:"6px 8px"}}>{t("Fecha","Date")}</th><th style={{padding:"6px 8px"}}>{t("Resp.","Resp.")}</th><th></th>
                        </tr></thead>
                        <tbody>
                          {enviosPagina.map(e=>(
                            <tr key={e.id} onClick={()=>setEnvioSelId(e.id)} style={{borderTop:"1px solid #F1F5F9",cursor:"pointer",background:envioSel&&envioSel.id===e.id?"#EFF6FF":"transparent"}}>
                              <td style={{padding:"8px",fontWeight:600,color:"#0F172A",maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(e.documentos||"—")+(e.clienteNombre?" · "+e.clienteNombre:"")}</td>
                              <td style={{padding:"8px"}}><span style={{color:(METODOS_ENVIO.find(m=>m.id===e.metodo)||{}).color||"#475569",fontWeight:700,fontSize:11}}>{e.metodo}</span></td>
                              <td style={{padding:"8px",fontFamily:"monospace",fontSize:11}}>{e.tracking}</td>
                              <td style={{padding:"8px"}}><span style={{background:colorEstadoEnvio(e.estado)+"22",color:colorEstadoEnvio(e.estado),fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:99,whiteSpace:"nowrap"}}>{e.estado}</span></td>
                              <td style={{padding:"8px",whiteSpace:"nowrap"}}>{fmtFecha(e.fechaEnvio)}</td>
                              <td style={{padding:"8px",maxWidth:80,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.responsable||"—"}</td>
                              <td style={{padding:"8px"}}>{isAdmin&&<button onClick={ev=>{ev.stopPropagation();eliminarEnvio(e);}} style={{background:"#FEE2E2",border:"none",borderRadius:6,padding:"3px 7px",fontSize:11,cursor:"pointer",color:"#B91C1C"}}>🗑</button>}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                        <div style={{fontSize:11,color:"#94A3B8"}}>{t(`Mostrando ${enviosPagina.length} de ${enviosList.length} envíos`,`Showing ${enviosPagina.length} of ${enviosList.length} shipments`)}</div>
                        <div style={{display:"flex",gap:4}}>
                          <button onClick={()=>setEnviosPage(p=>Math.max(1,p-1))} disabled={pagina<=1} style={{border:"1px solid #E2E8F0",background:"#fff",borderRadius:6,padding:"3px 9px",fontSize:12,cursor:"pointer",opacity:pagina<=1?0.4:1}}>‹</button>
                          {Array.from({length:totalPaginas},(_,i)=>i+1).slice(0,7).map(n=>(
                            <button key={n} onClick={()=>setEnviosPage(n)} style={{border:"1px solid",borderColor:n===pagina?"#0C447C":"#E2E8F0",background:n===pagina?"#0C447C":"#fff",color:n===pagina?"#fff":"#0F172A",borderRadius:6,padding:"3px 9px",fontSize:12,cursor:"pointer",fontWeight:n===pagina?700:400}}>{n}</button>
                          ))}
                          <button onClick={()=>setEnviosPage(p=>Math.min(totalPaginas,p+1))} disabled={pagina>=totalPaginas} style={{border:"1px solid #E2E8F0",background:"#fff",borderRadius:6,padding:"3px 9px",fontSize:12,cursor:"pointer",opacity:pagina>=totalPaginas?0.4:1}}>›</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* ── Columna derecha ── */}
            <div>
              <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:12,padding:14,marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:10}}>⚡ {t("Acciones rápidas","Quick actions")}</div>
                {[
                  ["💾",t("Guardar seguimiento","Save tracking"),guardarEnvio],
                  ["💬",t("Notificar cliente","Notify client"),()=>envioSel?notificarClienteEnvio(envioSel):showToastFn(t("Selecciona un envío primero","Select a shipment first"),"error")],
                  ["🔗",t("Abrir tracking","Open tracking"),()=>envioSel?abrirTrackingEnvio(envioSel):showToastFn(t("Selecciona un envío primero","Select a shipment first"),"error")],
                ].map(([ic,lab,fn],i)=>(
                  <button key={i} onClick={fn} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"10px 12px",fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:8,color:"#0F172A"}}><span>{ic} {lab}</span><span style={{color:"#94A3B8"}}>›</span></button>
                ))}
                <label style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"10px 12px",fontSize:13,fontWeight:600,cursor:"pointer",color:"#0F172A",boxSizing:"border-box"}}>
                  <span>☁️ {envioUploading?t("Subiendo...","Uploading..."):t("Subir comprobante","Upload proof")}</span><span style={{color:"#94A3B8"}}>›</span>
                  <input type="file" accept="image/*,.pdf" style={{display:"none"}} disabled={envioUploading} onChange={e=>{const f=e.target.files[0];if(!f)return;if(!envioSel){showToastFn(t("Selecciona un envío primero","Select a shipment first"),"error");return;}subirComprobanteEnvio(envioSel,f);e.target.value="";}}/>
                </label>
              </div>
              <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:12,padding:14,marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:8}}>ℹ️ {t("Información importante","Important information")}</div>
                <div style={{fontSize:12,color:"#64748B",lineHeight:1.6}}>{t("Desde aquí puedes guardar el método de envío, número de tracking, destinatario, fecha de entrega, comprobante subido y el responsable del envío. Esto crea un historial completo y verificable por caso.","Here you can save the carrier, tracking number, recipient, delivery date, uploaded proof and responsible staff. This creates a complete, verifiable history per case.")}</div>
              </div>
              <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:12,padding:14}}>
                <div style={{fontSize:13,fontWeight:700,color:"#92400E",marginBottom:8}}>💡 {t("Consejo","Tip")}</div>
                <div style={{fontSize:12,color:"#92400E",lineHeight:1.6}}>{t("Documenta cada envío para que, cuando el cliente pregunte: '¿Ustedes sí enviaron mis papeles?', puedas responder con pruebas claras y evitar confusiones.","Document every shipment so when a client asks 'did you really send my papers?', you can answer with clear proof and avoid disputes.")}</div>
              </div>
            </div>
          </div>
          )}
        </div>
      </div>
      );
    })()}

    {showUSCIS&&(
      <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:100,padding:"24px 16px",overflowY:"auto"}}>
        <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:760,boxShadow:"0 24px 64px rgba(0,0,0,0.2)",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{padding:"16px 24px",borderBottom:"1px solid #F1F5F9",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"#fff",zIndex:5}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:20}}>🔎</span>
              <div>
                <div style={{fontSize:15,fontWeight:800,color:"#0F172A",display:"flex",alignItems:"center",gap:8}}>{t("Verificador de caso USCIS","USCIS case checker")}<span style={{background:"#EEEDFE",color:"#3C3489",fontSize:10,fontWeight:700,padding:"2px 10px",borderRadius:99}}>PREMIUM</span></div>
                <div style={{fontSize:12,color:"#64748B"}}>{t("Registra y da seguimiento al estatus de cada recibo","Track the status of every receipt")}</div>
              </div>
            </div>
            <button onClick={()=>setShowUSCIS(false)} style={{background:"#F1F5F9",border:"none",borderRadius:8,padding:"7px 14px",fontSize:13,cursor:"pointer",fontWeight:600}}>{t("Cerrar","Close")}</button>
          </div>

          {!uscisHabilitado?(
            <div style={{padding:"48px 32px",textAlign:"center"}}>
              <div style={{fontSize:44,marginBottom:12}}>🔒</div>
              <div style={{fontSize:17,fontWeight:800,color:"#0F172A",marginBottom:8}}>{t("Disponible en el Plan Premium","Available on the Premium plan")}</div>
              <div style={{fontSize:13,color:"#64748B",maxWidth:420,margin:"0 auto 20px",lineHeight:1.6}}>{t("Lleva el control de todos tus casos con USCIS: recibo, estatus actual, historial de cambios, notas internas y notificación al cliente por WhatsApp — todo en un solo lugar.","Track all your USCIS cases: receipt, current status, change history, internal notes and WhatsApp client notifications — all in one place.")}</div>
              <div style={{fontSize:13,color:"#0C447C",fontWeight:600}}>{t("Contacta a ImmigPath para activar el Plan Premium","Contact ImmigPath to activate the Premium plan")}</div>
            </div>
          ):(
            <div style={{padding:"20px 24px"}}>
              <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:12,padding:16,marginBottom:16}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:10}}>{t("Registrar / actualizar caso","Add / update case")}</div>
                <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Número de recibo (13 caracteres)","Receipt number (13 characters)")}</label>
                    <input value={uscisForm.recibo} onChange={e=>setUscisForm(f=>({...f,recibo:e.target.value.toUpperCase()}))} placeholder="IOE1234567890" maxLength={13} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,fontFamily:"monospace",letterSpacing:1,outline:"none"}}/>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Formulario","Form")}</label>
                    <select value={uscisForm.formulario} onChange={e=>setUscisForm(f=>({...f,formulario:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none",background:"#fff"}}>
                      {FORMULARIOS_USCIS.map(fo=><option key={fo} value={fo}>{fo}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Estatus actual (como lo muestra USCIS)","Current status (as shown by USCIS)")}</label>
                    <select value={uscisForm.estatus} onChange={e=>setUscisForm(f=>({...f,estatus:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none",background:"#fff"}}>
                      <option value="">{t("— Selecciona el estatus —","— Select status —")}</option>
                      {ESTATUS_USCIS.map(s=><option key={s.en} value={s.en}>{lang==="es"?`${s.en} — ${s.es}`:s.en}</option>)}
                      <option value="__otro__">{t("Otro (escribir manualmente)","Other (type manually)")}</option>
                    </select>
                    {uscisForm.estatus==="__otro__"&&(
                      <input value={uscisForm.estatusOtro} onChange={e=>setUscisForm(f=>({...f,estatusOtro:e.target.value}))} placeholder={t("Escribe el estatus tal como aparece en USCIS","Type the status as shown on USCIS")} style={{width:"100%",marginTop:6,padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/>
                    )}
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase"}}>{t("Vincular cliente (opcional)","Link client (optional)")}</label>
                    <select value={uscisForm.clienteId} onChange={e=>setUscisForm(f=>({...f,clienteId:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:13,outline:"none",background:"#fff"}}>
                      <option value="">{t("— Sin vincular —","— Not linked —")}</option>
                      {clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
                    </select>
                  </div>
                </div>

              procesos[nom].cantidad++;
              procesos[nom].pagado += parseMoney(wd.pagado);
            });
          });
        });
        const totalNómina = Object.entries(procesos).reduce((sum,[nombre,data])=>{
          const tarifa = tarifasNómina[nombre]!==undefined?tarifasNómina[nombre]:(TARIFAS_DEFAULT[nombre]||50);
          return sum + (tarifa * data.cantidad);
        }, 0);
        return {emp, clientes:clientesSet.size, procesos, totalNómina};
      });

      const totalGeneral = nominaData.reduce((s,d)=>s+d.totalNómina, 0);

        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16,overflowY:"auto"}}>

                  let yPos=36;
                  let grandTotal=0;
                  nominaData.forEach((nd,empIdx)=>{
                    const empRows=Object.entries(nd.procesos).map(([nombre,data])=>{

                      return[keyClean,String(data.cantidad),"$"+tarifa.toFixed(2),"$"+(tarifa*data.cantidad).toFixed(2)];
                    });
                    const totalEmp=nd.totalNómina;
                    grandTotal+=totalEmp;
                    const empName=nd.emp.split("").filter(c=>{var n=c.charCodeAt(0);return n>=32&&n<=126;}).join("");
                    pdfdoc.setFillColor(241,245,249);pdfdoc.setDrawColor(226,232,240);
                    pdfdoc.roundedRect(margin,yPos,W-margin*2,12,2,2,"FD");
                    pdfdoc.setTextColor(30,58,95);pdfdoc.setFontSize(10);pdfdoc.setFont("helvetica","bold");
                    pdfdoc.text(empName,margin+4,yPos+7);
                    pdfdoc.setFontSize(8);pdfdoc.setFont("helvetica","normal");pdfdoc.setTextColor(100,116,139);
                    pdfdoc.text(nd.clientes+" caso"+(nd.clientes!==1?"s":"")+" en el periodo",margin+4,yPos+11.5);
                    pdfdoc.setTextColor(30,58,95);pdfdoc.setFontSize(11);pdfdoc.setFont("helvetica","bold");
                    pdfdoc.text("$"+totalEmp.toFixed(2),W-margin-4,yPos+7,{align:"right"});
                    yPos+=14;
                    pdfdoc.autoTable({
                      startY:yPos,
                      head:[["Proceso","Casos","Tarifa","Subtotal"]],
                      body:empRows.length>0?empRows:[["Sin casos en este periodo","—","—","—"]],
                      styles:{fontSize:8.5,cellPadding:[3,4]},
                      headStyles:{fillColor:[248,250,252],textColor:[100,116,139],fontStyle:"normal",fontSize:8,lineWidth:0.1,lineColor:[226,232,240]},
                      columnStyles:{0:{cellWidth:90},1:{cellWidth:18,halign:"center"},2:{cellWidth:28,halign:"right"},3:{cellWidth:28,halign:"right",fontStyle:"bold",textColor:[30,58,95]}},
                      foot:[[{content:"Total: $"+totalEmp.toFixed(2),colSpan:4,styles:{halign:"right",fillColor:[241,245,249],textColor:[30,58,95],fontStyle:"bold",fontSize:9}}]],
                      margin:{left:margin,right:margin},
                    });
                    yPos=pdfdoc.lastAutoTable.finalY+10;
                    if(yPos>260&&empIdx<nominaData.length-1){pdfdoc.addPage();yPos=20;}
                  });
                  if(yPos>260){pdfdoc.addPage();yPos=20;}
                  pdfdoc.setFillColor(30,58,95);pdfdoc.roundedRect(margin,yPos,W-margin*2,14,3,3,"F");
                  pdfdoc.setTextColor(168,196,224);pdfdoc.setFontSize(8);pdfdoc.setFont("helvetica","normal");
                  pdfdoc.text("TOTAL GENERAL DE NOMINA",margin+6,yPos+6);
                  pdfdoc.setTextColor(255,255,255);pdfdoc.setFontSize(13);pdfdoc.setFont("helvetica","bold");
                  pdfdoc.text("$"+grandTotal.toFixed(2),W-margin-4,yPos+10,{align:"right"});
                  const totalPages=pdfdoc.internal.getNumberOfPages();
                  for(let i=1;i<=totalPages;i++){
                    pdfdoc.setPage(i);pdfdoc.setFontSize(7);pdfdoc.setTextColor(148,163,184);pdfdoc.setFont("helvetica","normal");
                    const pageH=pdfdoc.internal.pageSize.height;

                    pdfdoc.text("CONFIDENCIAL | "+onPDF+" | Pag "+i+" de "+totalPages,margin,pageH-5);
                  }
                  pdfdoc.save("nomina-"+nominaPeriodoInicio+"-al-"+nominaPeriodoFin+".pdf");
                  showToastFn("PDF de nomina descargado");
                }} style={{background:"#1E3A5F",color:"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:13,cursor:"pointer",fontWeight:600}}>{ t("Descargar PDF","Download PDF") }</button>
                <button onClick={()=>setShowNómina(false)} style={{background:"#E2E8F0",border:"none",borderRadius:8,padding:"8px 14px",fontSize:13,cursor:"pointer",fontWeight:600}}>{ t("Cerrar","Close") }</button>

            </div>
            <div style={{background:"#fff",borderRadius:12,padding:"16px",marginBottom:16,border:"1px solid #E2E8F0"}}>

            </div>
            {empleadas.length===0?<div style={{textAlign:"center",padding:40,color:"#94A3B8"}}>No hay empleadas con clientes asignados</div>:

              </div>
            ))}
            {nominaData.length>0&&<div style={{background:"#1E293B",borderRadius:12,padding:"16px",border:"1px solid #334155"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                  <div style={{fontSize:12,color:"#64748B",marginTop:2}}>{nominaPeriodoInicio} al {nominaPeriodoFin}</div>
                </div>
                <div style={{fontSize:24,fontWeight:800,color:"#34D399"}}>{fmtMoney(totalGeneral)}</div>
              </div>
            </div>}

          </div>
        </div>
      );
    })()}

    {showSoporte&&isAdmin&&(

                  <input value={servicioForm.numeroCaso||""} onChange={e=>upd("numeroCaso",e.target.value)} style={{width:"100%",padding:"9px 11px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13}}/>
                </>)}

                  <label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:4}}>Fecha de mudanza</label>
                  <input type="date" value={servicioForm.fechaMudanza||""} onChange={e=>upd("fechaMudanza",e.target.value)} style={{width:"100%",padding:"9px 11px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13}}/>
                  <div style={{background:"#FFFBEB",borderRadius:8,padding:"10px 12px",fontSize:11,color:"#92400E",marginTop:12}}>📌 El cliente debe comparecer a audiencias ya programadas hasta que se otorgue la moción.</div>
                </>)}
                {tipo==="transferencia"&&servicioStep===4&&(<>
                  <label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:4}}>Tipo de evidencia de mudanza</label>
                  <select value={servicioForm.tipoEvidencia||""} onChange={e=>upd("tipoEvidencia",e.target.value)} style={{width:"100%",padding:"9px 11px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,marginBottom:12}}>
                    <option value="">Seleccionar...</option>
                    <option value="Contrato de renta">Contrato de renta</option>
                    <option value="Factura de servicios">Factura de servicios (luz, agua, internet)</option>

                  </select>
                  <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                    <input type="checkbox" checked={servicioForm.eoir33Incluido||false} onChange={e=>upd("eoir33Incluido",e.target.checked)} style={{width:16,height:16}}/>
                    <span style={{fontSize:13,color:"#374151"}}>Formulario EOIR-33/IC incluido con esta moción</span>
                  </label>
                </>)}
                {tipo==="transferencia"&&servicioStep===5&&(<>
                  <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:10}}>Revisión y cobro</div>
                  <div style={{background:"#F8FAFC",borderRadius:8,padding:12,marginBottom:14,fontSize:12,color:"#374151"}}>
                    <div style={{marginBottom:4}}><b>De:</b> {servicioForm.tribunalActual||"-"} <b>A:</b> {servicioForm.tribunalDestino||"-"}</div>
                    <div style={{marginBottom:4}}><b>Nueva dirección:</b> {servicioForm.direccionNueva||"-"}</div>
                    <div><b>Evidencia:</b> {servicioForm.tipoEvidencia||"-"}</div>
                  </div>
                  <label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:4}}>Monto a cobrar</label>
                  <input value={servicioForm.montoCobrar!==undefined?servicioForm.montoCobrar:(pagosConfig.precioTransferencia||"")} onChange={e=>upd("montoCobrar",e.target.value)} placeholder="75" style={{width:"100%",padding:"9px 11px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,marginBottom:10}}/>
                  <label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:4}}>Asignar a</label>
                  <select value={servicioForm.encargadaTramite||""} onChange={e=>upd("encargadaTramite",e.target.value)} style={{width:"100%",padding:"9px 11px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13}}>
                    <option value="">Sin asignar</option>{equipo.map(m=><option key={m} value={m}>{m}</option>)}
                  </select>
                </>)}

              </div>

              <div style={{padding:"14px 24px 20px",borderTop:"1px solid #F1F5F9",display:"flex",justifyContent:"space-between"}}>
                <button onClick={()=>servicioStep===1?closeModal():setServicioStep(s=>s-1)} style={{padding:"9px 18px",borderRadius:8,border:"1px solid #D1D5DB",background:"#fff",fontSize:13,cursor:"pointer"}}>{servicioStep===1?"Cancelar":"← Atrás"}</button>
                {servicioStep<totalSteps?(
                  <button onClick={()=>setServicioStep(s=>s+1)} style={{padding:"9px 20px",borderRadius:8,border:"none",background:"#1E40AF",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>Siguiente →</button>
                ):(
                  <button disabled={servicioSaving} onClick={finalizarYCobrar} style={{padding:"9px 20px",borderRadius:8,border:"none",background:servicioSaving?"#94A3B8":"#16A34A",color:"#fff",fontSize:13,fontWeight:700,cursor:servicioSaving?"not-allowed":"pointer"}}>{servicioSaving?"Procesando...":"✅ Confirmar y generar PDF"}</button>
                )}
              </div>
            </>);
          })()}

        </div>
      </div>
    )}

        {toast&&<div style={{position:"fixed",bottom:24,right:24,background:toast.type==="error"?"#EF4444":"#0F172A",color:"#fff",padding:"11px 18px",borderRadius:10,fontSize:14,fontWeight:500,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",zIndex:200}}>{toast.msg}</div>}
  </div>);
}

//  Editor de Caso simplificado 
function CasoEditorSimple({caso,onChange,onDelete,isAdmin=true,equipo=[],clienteId=null,clienteNombre="",todosCasos=[],onIniciarServicio=()=>{}}){
  const sys=SISTEMAS[caso.sistema]||SISTEMAS.uscis;
  return(<div style={{background:"#F8FAFC",border:`2px solid ${sys.border}`,borderRadius:10,padding:"14px",marginBottom:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{display:"flex",gap:6}}>

        ))}
      </div>
      <button onClick={onDelete} style={{background:"#FEF2F2",color:"#EF4444",border:"1px solid #FECACA",borderRadius:7,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>{t("🗑 Eliminar","🗑 Delete")}</button>
    </div>
    <div style={{marginBottom:10}}>
      <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>{t("Tipo de caso","Case type")}</label>
      <select value={caso.tipoCaso} onChange={e=>onChange({...caso,tipoCaso:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,background:"#fff",cursor:"pointer"}}>
        <option value="">Seleccionar...</option>{SISTEMAS[caso.sistema].tiposCaso.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      {caso.sistema==="uscis"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>{t("N° Recibo","Receipt #")}</label><input value={caso.receiptNum||""} onChange={e=>onChange({...caso,receiptNum:e.target.value.toUpperCase()})} placeholder="IOE0912345678" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>}
      <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>{t("A# Alien","Alien #")}</label><input value={caso.alienNum||""} onChange={e=>onChange({...caso,alienNum:e.target.value.replace(/[^\d-]/g,"")})} placeholder="012-345-678" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>
      {caso.sistema==="eoir"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>{t("Corte","Court")}</label><input value={caso.corte||""} onChange={e=>onChange({...caso,corte:e.target.value})} placeholder="Miami Immigration Court" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>}
      {caso.sistema==="eoir"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>{t("Juez","Judge")}</label><input value={caso.juez||""} onChange={e=>onChange({...caso,juez:e.target.value})} placeholder="Hon. Rivera" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>}
    </div>

    
    {caso.sistema==="uscis"&&(caso.tipoCaso||"").includes("I-589")&&(
      <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#1D4ED8",marginBottom:8}}>I-589 Asilo — Citas</div>
        <div style={{marginBottom:8}}>
          <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Tipo de cita</label>
          <select value={caso.tipoCita||""} onChange={e=>onChange({...caso,tipoCita:e.target.value,fechaCorte:"",fechaHuellas:""})} style={{width:"100%",padding:"7px 9px",borderRadius:6,border:"1px solid #BFDBFE",fontSize:13,background:"#fff",cursor:"pointer"}}>
            <option value="">Seleccionar...</option>
            <option value="huellas">🫆 Biométricos</option>
            <option value="entrevista">🎤 Entrevista</option>
            <option value="ambas">📅 Ambas</option>
          </select>
        </div>
        {caso.tipoCita==="huellas"&&<div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>📅 Fecha Biométricos</label><input type="date" value={caso.fechaHuellas||""} onChange={e=>onChange({...caso,fechaHuellas:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div>}
        {caso.tipoCita==="entrevista"&&<div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>🎤 Fecha de Entrevista</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div>}
        {caso.tipoCita==="ambas"&&<><div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}> Fecha Biométricos</label><input type="date" value={caso.fechaHuellas||""} onChange={e=>onChange({...caso,fechaHuellas:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div><div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>🎤 Fecha de Entrevista</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div></>}
        
        <div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#A5B4FC",marginBottom:3,textTransform:"uppercase"}}>⏱️ Fecha en que se ingresó el asilo</label><input type="date" value={caso.fechaAsilo||""} onChange={e=>onChange({...caso,fechaAsilo:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #4338CA",background:"#1E1B4B",color:"#fff",fontSize:13,outline:"none"}}/></div>
        {caso.fechaAsilo&&(()=>{const inicio=new Date(caso.fechaAsilo+"T00:00:00");const hoy=new Date();hoy.setHours(0,0,0,0);const dias=Math.floor((hoy-inicio)/86400000);const pct=Math.min(100,Math.round((dias/180)*100));const color=dias>=180?"#4ADE80":dias>=120?"#FACC15":"#60A5FA";return(<div style={{background:"#1E1B4B",border:"1px solid #4338CA",borderRadius:8,padding:"10px 12px"}}><div style={{display:"flex",alignItems:"center",gap:12}}><div style={{textAlign:"center",minWidth:50}}><div style={{fontSize:28,fontWeight:800,color,lineHeight:1}}>{dias}</div><div style={{fontSize:10,color:"#A5B4FC"}}>{t("días","days")}</div></div><div style={{flex:1}}><div style={{background:"#312E81",borderRadius:20,height:8,overflow:"hidden",marginBottom:4}}><div style={{height:"100%",borderRadius:20,background:color,width:`${pct}%`}}/></div><div style={{fontSize:11,color,fontWeight:600}}>{dias>=180?(dias>=180?"✅ Elegible para EAD":"✅ Eligible for EAD")+" — "+dias+(_lang==="es"?" días":" days"):(_lang==="es"?`⏳ Faltan ${180-dias} días para EAD`:`⏳ ${180-dias} days until EAD`)}</div></div></div></div>);})()} 
      </div>
    )}

    {(caso.sistema==="uscis"&&(caso.tipoCaso||"").includes("I-589")||caso.sistema==="eoir"&&(caso.tipoCaso||"").toLowerCase().includes("asilo"))&&(
      <div style={{background:"#FAF5FF",border:"1px solid #E9D5FF",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#7C3AED",marginBottom:8}}>👨‍👩‍👧‍👦 {t("Caso Familiar","Family Case")}</div>
        <div style={{display:"flex",gap:8,marginBottom:(caso.dependientes||[]).length>0||caso.esFamiliar?10:0}}>
          <button onClick={()=>onChange({...caso,esFamiliar:true})} style={{flex:1,padding:"8px",borderRadius:7,border:caso.esFamiliar?"2px solid #7C3AED":"1px solid #E2E8F0",background:caso.esFamiliar?"#F5F3FF":"#fff",color:caso.esFamiliar?"#7C3AED":"#374151",fontWeight:caso.esFamiliar?700:400,fontSize:12,cursor:"pointer"}}>{t("Sí, caso familiar","Yes, family case")}</button>
          <button onClick={()=>onChange({...caso,esFamiliar:false})} style={{flex:1,padding:"8px",borderRadius:7,border:!caso.esFamiliar?"2px solid #64748B":"1px solid #E2E8F0",background:!caso.esFamiliar?"#F8FAFC":"#fff",color:!caso.esFamiliar?"#374151":"#94A3B8",fontWeight:!caso.esFamiliar?700:400,fontSize:12,cursor:"pointer"}}>{t("No, solo principal","No, principal only")}</button>

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>

    )}

    
    {caso.sistema==="uscis"&&<div style={{marginBottom:10}}>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        {[
          ["activo","✅ Activo","#16A34A","#F0FDF4","#BBF7D0"],
          ["referido_eoir","🔒 Cerrado — Referido a EOIR","#7C3AED","#F5F3FF","#DDD6FE"],
          ["aprobado","🔒 Cerrado — Aprobado","#0369A1","#F0F9FF","#BAE6FD"],

    {caso.sistema==="eoir"&&(caso.tipoCaso||"").toLowerCase().includes("asilo")&&<div style={{marginBottom:8}}>

      {caso.fechaAsilo&&(()=>{const inicio=new Date(caso.fechaAsilo+"T00:00:00");const hoy=new Date();hoy.setHours(0,0,0,0);const dias=Math.floor((hoy-inicio)/86400000);const pct=Math.min(100,Math.round((dias/180)*100));const color=dias>=180?"#4ADE80":dias>=120?"#FACC15":"#60A5FA";return(<div style={{background:"#1E1B4B",border:"1px solid #4338CA",borderRadius:8,padding:"10px 12px",marginTop:6}}><div style={{display:"flex",alignItems:"center",gap:12}}><div style={{textAlign:"center",minWidth:50}}><div style={{fontSize:28,fontWeight:800,color,lineHeight:1}}>{dias}</div><div style={{fontSize:10,color:"#A5B4FC"}}>{t("días","days")}</div></div><div style={{flex:1}}><div style={{background:"#312E81",borderRadius:20,height:8,overflow:"hidden",marginBottom:4}}><div style={{height:"100%",borderRadius:20,background:color,width:`${pct}%`}}/></div><div style={{fontSize:11,color,fontWeight:600}}>{dias>=180?(dias>=180?"✅ Elegible para EAD":"✅ Eligible for EAD")+" — "+dias+(_lang==="es"?" días":" days"):(_lang==="es"?`⏳ Faltan ${180-dias} días para EAD`:`⏳ ${180-dias} days until EAD`)}</div></div></div></div>);})()} 
    </div>}

                    <div><label style={{display:"block",fontSize:10,fontWeight:600,color:"#64748B",marginBottom:2}}>{t("N° recibo EAD","EAD receipt #")}</label><input value={wd.eadReceipt||""} onChange={e=>updWD(i,"eadReceipt",e.target.value)} placeholder="IOE..." style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,fontFamily:"monospace"}}/></div>

                      <div><label style={{display:"block",fontSize:10,color:"#854F0B",marginBottom:2}}>{t("Pagado","Paid")}</label><input value={wd.pagado||""} onChange={e=>updWD(i,"pagado",e.target.value)} placeholder="0" style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #FAC775",fontSize:12}}/></div>

                  </div>
                </div>);
              })}
            </div>
          </div>);
        })()}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>{t("Tracking FOIA","FOIA Tracking")}</label><input value={caso.foiaTracking||""} onChange={e=>onChange({...caso,foiaTracking:e.target.value})} placeholder="NRC2024123456" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>
