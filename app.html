//  Helpers 
function getStatus(f){if(!f)return"pendiente";const h=new Date();h.setHours(0,0,0,0);const d=Math.round((new Date(f+"T00:00:00")-h)/86400000);if(d<0)return"vencido";if(d===0)return"hoy";if(d<=3)return"urgente";if(d<=14)return"proximo";return"ok";}
function getDias(f){if(!f)return null;const h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(f+"T00:00:00")-h)/86400000);}
function fmt(f){if(!f)return"—";const[y,m,d]=f.split("-");return`${m}/${d}/${y}`;}
function fmtA(a){const c=(a||"").replace(/\D/g,"").slice(0,9);if(c.length<=3)return c;if(c.length<=6)return c.slice(0,3)+"-"+c.slice(3);return c.slice(0,3)+"-"+c.slice(3,6)+"-"+c.slice(6);}
function eoirUrl(a){return`https://acis.eoir.justice.gov/en/CaseInformation?caseNumber=${(a||"").replace(/\D/g,"")}`;}
function uscisUrl(r){return`https://egov.uscis.gov/casestatus/mycasestatus.do?appReceiptNum=${(r||"").replace(/\s/g,"")}`;}
function fmtMoney(v){if(!v&&v!==0)return"";const n=parseFloat(v.toString().replace(/[^0-9.]/g,""));if(isNaN(n))return"";return"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseMoney(v){return parseFloat((v||"0").toString().replace(/[^0-9.]/g,""))||0;}
function getPct(total,pagado){if(!total)return null;return Math.min(100,Math.round((pagado/total)*100));}
function pagoColor(pct){if(pct===null)return"#6B7280";if(pct>=100)return"#16A34A";if(pct>=50)return"#D97706";return"#DC2626";}
function getTotalProcesos(procesos){return(procesos||[]).reduce((s,p)=>s+parseMoney(p.precio),0);}
function getTotalPagado(procesos){return(procesos||[]).reduce((s,p)=>s+parseMoney(p.pagado),0);}
function getProximaFecha(cliente){const fechas=[];(cliente.casos||[]).forEach(c=>{if(c.fechaCorte)fechas.push(c.fechaCorte);if(c.fechaHuellas)fechas.push(c.fechaHuellas);});if(!fechas.length)return null;const hoy=new Date();hoy.setHours(0,0,0,0);const futuras=fechas.filter(f=>new Date(f+"T00:00:00")>=hoy).sort();if(futuras.length)return futuras[0];return fechas.sort().reverse()[0];}
function getStatusCliente(cliente){const pf=getProximaFecha(cliente);if(!pf)return"pendiente";return getStatus(pf);}

//  Editor de procesos de pago 
function ProcesosEditor({procesos,onChange}){
  const add=()=>onChange([...procesos,{nombre:"",precio:"",pagado:"",notas:"",id:Date.now()}]);
  const upd=(i,f,v)=>{const n=[...procesos];n[i]={...n[i],[f]:v};onChange(n);};
  const del=(i)=>onChange(procesos.filter((_,idx)=>idx!==i));
  const total=getTotalProcesos(procesos);const pagado=getTotalPagado(procesos);const pct=getPct(total,pagado);const pc=pagoColor(pct);
  return(<div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"12px",marginBottom:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:12,fontWeight:700,color:"#D97706"}}>💰 Pagos de este proceso</div>
      <button onClick={add} style={{background:"#1E40AF",color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>+ Agregar pago</button>
    </div>
    {procesos.length===0&&<div style={{fontSize:11,color:"#94A3B8",textAlign:"center",padding:"6px 0"}}>Sin pagos registrados</div>}
    {procesos.map((p,i)=>(
      <div key={p.id||i} style={{background:"#fff",borderRadius:7,padding:"9px 11px",marginBottom:7,border:"1px solid #FDE68A"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
          <select value={p.nombre} onChange={e=>upd(i,"nombre",e.target.value)} style={{flex:1,padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,background:"#fff",cursor:"pointer",marginRight:8}}>
            <option value="">Seleccionar proceso...</option>{PROCESOS_COMUNES.map(pc=><option key={pc} value={pc}>{pc}</option>)}
          </select>
          <button onClick={()=>del(i)} style={{background:"#FEF2F2",color:"#EF4444",border:"1px solid #FECACA",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:6}}>
          <div><label style={{display:"block",fontSize:10,fontWeight:600,color:"#374151",marginBottom:2,textTransform:"uppercase"}}>Precio</label><input value={p.precio} onChange={e=>upd(i,"precio",e.target.value)} placeholder="Ej. 2500" style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,outline:"none"}}/></div>
          <div><label style={{display:"block",fontSize:10,fontWeight:600,color:"#374151",marginBottom:2,textTransform:"uppercase"}}>Pagado</label><input value={p.pagado} onChange={e=>upd(i,"pagado",e.target.value)} placeholder="Ej. 1000" style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #D1D5DB",fontSize:12,outline:"none"}}/></div>
        </div>
        {p.precio&&<><div style={{background:"#E2E8F0",borderRadius:20,height:4}}><div style={{height:"100%",borderRadius:20,background:pagoColor(getPct(parseMoney(p.precio),parseMoney(p.pagado))),width:`${getPct(parseMoney(p.precio),parseMoney(p.pagado))||0}%`}}/></div><div style={{fontSize:10,color:pagoColor(getPct(parseMoney(p.precio),parseMoney(p.pagado))),fontWeight:700,marginTop:2}}>{fmtMoney(p.pagado)||"$0"} / {fmtMoney(p.precio)} — {getPct(parseMoney(p.precio),parseMoney(p.pagado))||0}%</div></>}
        <input value={p.notas||""} onChange={e=>upd(i,"notas",e.target.value)} placeholder="Notas de pago..." style={{width:"100%",padding:"5px 8px",borderRadius:6,border:"1px solid #E2E8F0",fontSize:11,outline:"none",marginTop:6}}/>

    ))}

      <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,fontWeight:700,color:"#92400E"}}>Total</span><span style={{fontSize:12,fontWeight:800,color:"#92400E"}}>{fmtMoney(pagado)} / {fmtMoney(total)}</span></div>
      <div style={{background:"#E2E8F0",borderRadius:20,height:5,marginTop:4}}><div style={{height:"100%",borderRadius:20,background:pc,width:`${pct||0}%`}}/></div>
      <div style={{fontSize:10,color:pc,fontWeight:700,marginTop:2}}>{pct!==null?`${pct}% — Saldo: ${fmtMoney(total-pagado)}`:"Sin info"}</div>
    </div>}

}

//  LOGIN 
function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const login=async()=>{if(!email||!pw){setErr("Ingresa tu email y contraseña");return;}setLoading(true);setErr("");
    try{
      const{auth,signInWithEmailAndPassword,db,doc,getDoc}=window._firebase;
      const cred=await signInWithEmailAndPassword(auth,email,pw);
      const userDoc=await getDoc(doc(db,"users",cred.user.uid));
      if(!userDoc.exists())throw new Error("Usuario no encontrado");
      const userData=userDoc.data();
      if(!["office_admin","employee","superadmin"].includes(userData.role))throw new Error("Sin acceso");
      // Get office data
      let officeInfo=null;
      if(userData.officeId){
        const officeDoc=await getDoc(doc(db,"offices",userData.officeId));
        if(officeDoc.exists())officeInfo={id:officeDoc.id,...officeDoc.data()};
      }
      onLogin(cred.user,userData,officeInfo);
    }catch(e){setErr("Email o contraseña incorrectos");}setLoading(false);};
  return(<div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0F172A 0%,#1E40AF 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:400,padding:36,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
      <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:48,marginBottom:8}}>⚖️</div><h1 style={{fontSize:22,fontWeight:800,color:"#0F172A",margin:0}}>Monitor de Inmigración</h1><p style={{fontSize:13,color:"#64748B",marginTop:6}}>Ingresa con tu cuenta para continuar</p></div>
      <div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" onKeyDown={e=>e.key==="Enter"&&login()} style={{width:"100%",padding:"11px 13px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/></div>
      <div style={{marginBottom:20}}><label style={{display:"block",fontSize:12,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>Contraseña</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&login()} style={{width:"100%",padding:"11px 13px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/></div>
      {err&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#DC2626",marginBottom:16}}>⚠️ {err}</div>}
      <button onClick={login} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:9,border:"none",background:loading?"#E5E7EB":"#1E40AF",color:loading?"#9CA3AF":"#fff",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer"}}>{loading?"Ingresando...":"Ingresar →"}</button>
    </div></div>);
}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>

                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <button onClick={()=>{
                      // PDF del formulario de intake
                      const jsPDFb=(window.jspdf&&window.jspdf.jsPDF)?window.jspdf.jsPDF:window.jsPDF;
                      if(!jsPDFb){showToastFn("Error cargando PDF","error");return;}
                      const pdoc=new jsPDFb({orientation:"portrait",unit:"mm",format:"a4"});
                      const W=210; const M=14;
                      // Header
                      pdoc.setFillColor(30,58,95);pdoc.rect(0,0,W,26,"F");
                      pdoc.setTextColor(255,255,255);pdoc.setFontSize(13);pdoc.setFont("helvetica","bold");

                      pdoc.setFontSize(8);pdoc.setFont("helvetica","normal");pdoc.setTextColor(168,196,224);

                      const sections=[
                        {title:"DATOS PERSONALES",rows:[

                          ["Pais de origen",b.paisOrigen||"—"],

                          ["Email",b.email||"—"],

                          ["Idioma preferido",b.idioma||"—"],
                          ["Direccion",b.direccion||"—"],
                        ]},

                          ["Como entro al pais",b.formaEntrada||"—"],
                          ["Orden de deportacion",b.ordenDeportacion||"—"],
                          ["Detenido por ICE/CBP",b.detenidoICE||"—"],
                          ["Proceso en corte EOIR",b.procesoEOIR||"—"],
                          ["Fecha audiencia",b.fechaAudiencia||"—"],

              </div>

            {/* CONTADOR */}

              📋 <strong style={{color:"#0F172A"}}>{pdfClientes.length} cliente{pdfClientes.length!==1?"s":""}</strong> en el reporte
            </div>

            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button onClick={()=>{setShowPDF(false);setPdfOpts({sistema:"todos",estado:"todos"});}} style={{padding:"10px 22px",borderRadius:9,border:"1px solid #D1D5DB",background:"#fff",color:"#374151",fontSize:14,cursor:"pointer",fontWeight:500}}>Cancelar</button>
              <button onClick={()=>{
                // Generar PDF con los clientes filtrados del modal
                const jsPDF=(window.jspdf&&window.jspdf.jsPDF)?window.jspdf.jsPDF:window.jsPDF;
                if(!jsPDF){showToastFn("Error cargando PDF. Recarga la pagina.","error");return;}
                const pdfdoc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
                const datos=pdfClientes;
                if(!datos.length){showToastFn("Sin clientes para este filtro","error");return;}

                  //  Helper: limpiar texto para jsPDF 
                  const cleanTxt = s => { if(!s) return ""; let r=""; for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c>=32&&c<=126)r+=s[i];} return r.trim(); };
                  const W2 = 297; const M = 10;

                  //  HEADER 
                  // Banda superior azul marino
                  pdfdoc.setFillColor(30,58,95);
                  pdfdoc.rect(0,0,W2,26,"F");
                  // Nombre oficina
                  pdfdoc.setTextColor(255,255,255);
                  pdfdoc.setFontSize(12);
                  pdfdoc.setFont("helvetica","bold");
                  pdfdoc.text(cleanTxt(officeData?.name||"Monitor de Inmigracion"), M, 10);

                  pdfdoc.setFont("helvetica","normal");
                  pdfdoc.setTextColor(168,196,224);
                  const fechaPDF = new Date().toLocaleDateString("es-US",{day:"numeric",month:"long",year:"numeric"});
                  pdfdoc.text(fechaPDF + "   |   " + datos.length + " clientes   |   " + cleanTxt(user.email), M, 17);

                  pdfdoc.setFillColor(255,255,255);
                  pdfdoc.setFillColor(255,255,255,0.12);
                  pdfdoc.setDrawColor(255,255,255,0.25);
                  pdfdoc.roundedRect(W2-M-30, 7, 28, 7, 1.5, 1.5, "FD");
                  pdfdoc.setTextColor(203,216,232);
                  pdfdoc.setFontSize(6.5);
                  pdfdoc.text("Confidencial", W2-M-29, 12);

                  //  TABLA 
                  // (estado removido del PDF  no se muestra)

                  const rows3=[];
                  datos.forEach(c=>{
                    const st=getStatusCliente(c);
                    const pf=getProximaFecha(c);
                    const dias=pf?getDias(pf):null;
                    const totalP=(c.casos||[]).reduce((s,ca)=>s+getTotalProcesos(ca.procesos||[]),0);
                    const pagadoP=(c.casos||[]).reduce((s,ca)=>s+getTotalPagado(ca.procesos||[]),0);
                    const pct=getPct(totalP,pagadoP);
                    // Sistemas: texto limpio deduplicado, separado por "  "
                    const TIPO_SHORT={"I-485 Ajuste de estatus":"Ajuste","I-130 Peticion familiar":"I-130","I-765 Permiso de trabajo":"W.P.","I-131 Advance Parole":"A.P.","N-400 Naturalizacion":"N-400","I-589 Asilo":"Asilo","I-90 Renovar Green Card":"I-90","Asilo":"Asilo","Deportacion":"Deportacion","Cancelacion":"Cancelacion","Ajuste de estatus":"Ajuste","Apelacion":"Apelacion","FOIA - Expediente migratorio":"FOIA","FOIA - Expediente USCIS":"FOIA","FOIA - Expediente ICE":"FOIA","FOIA - Expediente CBP":"FOIA","Otro":"Otro"};
                    const sistemasUnicos=[...new Set((c.casos||[]).map(ca=>(ca.sistema||"").toUpperCase()).filter(Boolean))];
                    const tiposUnicos=[...new Set((c.casos||[]).map(ca=>{const t=cleanTxt(ca.tipoCaso||"");return TIPO_SHORT[t]||t.split(" ")[0]||"";}).filter(Boolean))];
                    const sistemasStr=[...sistemasUnicos,...tiposUnicos].join(" · ");
                    // Tiempo legible
                    let tiempoStr="—";
                    if(dias!==null){
                      if(dias<0) tiempoStr="Hace "+Math.abs(dias)+"d";
                      else if(dias===0) tiempoStr="Hoy";
                      else tiempoStr="+"+dias+"d";
                    }
                    // Fecha de ingreso del cliente al sistema
                    const fechaIngreso=c.createdAt?new Date(c.createdAt).toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}):"—";
                    // Pais en una sola linea (max 12 chars)
                    const paisStr=cleanTxt(c.paisOrigen)||"—";
                    // Alien num sin guiones partidos
                    const alienStr=fmtA(c.alienNum)||"—";
                    rows3.push({
                      row:[
                        cleanTxt(c.nombre)||"—",
                        paisStr,
                        alienStr,
                        sistemasStr,
                        fechaIngreso,
                        cleanTxt(c.encargada)||"—",
                        totalP?fmtMoney(totalP):"—",
                        pagadoP?fmtMoney(pagadoP):"—",
                      ],
                      status:st
                    });
                  });

                  pdfdoc.autoTable({
                    startY: 30,
                    head:[["Nombre","Pais","Num. Alien","Sistemas","Ingreso","Encargada","Total","Pagado"]],
                    body: rows3.map(r=>r.row),
                    styles:{
                      fontSize: 7.5,
                      cellPadding: [3,4],
                      overflow: "linebreak",
                      valign: "middle",
                      textColor: [30,41,59],
                      lineColor: [226,232,240],
                      lineWidth: 0.1
                    },
                    headStyles:{
                      fillColor: [30,58,95],
                      textColor: [255,255,255],
                      fontStyle: "bold",
                      fontSize: 7.5,
                      cellPadding: [4,4],
                      lineWidth: 0
                    },
                    alternateRowStyles:{
                      fillColor: [248,250,252]
                    },
                    columnStyles:{
                      0:{cellWidth:40, fontStyle:"bold"},
                      1:{cellWidth:22},
                      2:{cellWidth:26, fontSize:7.5},
                      3:{cellWidth:68},
                      4:{cellWidth:22, halign:"center"},
                      5:{cellWidth:32},
                      6:{cellWidth:22, halign:"right"},
                      7:{cellWidth:22, halign:"right"},
                    },
                    didParseCell:(data)=>{
                      if(data.section==="body" && data.column.index===0){
                        data.cell.styles.textColor=[30,58,95];
                        data.cell.styles.fontStyle="bold";
                      }
                    },
                    margin:{left:M, right:M},
                    tableLineColor:[226,232,240],
                    tableLineWidth:0.1
                  });

                  //  FOOTER 
                  const pcPDF=pdfdoc.internal.getNumberOfPages();
                  for(let i=1;i<=pcPDF;i++){
                    pdfdoc.setPage(i);
                    const pH=pdfdoc.internal.pageSize.height;
                    pdfdoc.setDrawColor(226,232,240);
                    pdfdoc.setLineWidth(0.3);
                    pdfdoc.line(M, pH-8, W2-M, pH-8);
                    pdfdoc.setFontSize(6.5);
                    pdfdoc.setTextColor(148,163,184);
                    pdfdoc.setFont("helvetica","normal");
                    pdfdoc.text("CONFIDENCIAL — Solo para uso interno  |  "+cleanTxt(officeData?.name||"ImmigPath")+"  |  Pag "+i+" de "+pcPDF, M, pH-3.5);
                  }

                pdfdoc.save("reporte-"+new Date().toISOString().slice(0,10)+".pdf");
                setShowPDF(false);setPdfOpts({sistema:"todos",estado:"todos"});
                showToastFn("PDF: "+datos.length+" clientes");
              }} disabled={pdfClientes.length===0} style={{padding:"10px 22px",borderRadius:9,border:"none",background:pdfClientes.length===0?"#E5E7EB":"#1E40AF",color:pdfClientes.length===0?"#9CA3AF":"#fff",fontSize:14,fontWeight:700,cursor:pdfClientes.length===0?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:7}}>

                    <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase"}}>Desglose por proceso</div>

          </div>
        </div>
      );
    })()}

    {/* TOAST */}

          <div style={{background:"#F8FAFC",borderRadius:10,padding:"16px",marginBottom:14,border:"1px solid #E2E8F0"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:12}}>💚 Zelle</div>

              <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:4,textTransform:"uppercase"}}>Nombre en Zelle</label>

            </div>
            <div style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:4,textTransform:"uppercase"}}>Email de Zelle</label>

            </div>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:4,textTransform:"uppercase"}}>Telefono de Zelle (opcional)</label>

            </div>
          </div>
          {/* STRIPE */}
          <div style={{background:"#F8FAFC",borderRadius:10,padding:"16px",marginBottom:20,border:"1px solid #E2E8F0"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:12}}>💳 Stripe</div>

          </div>
        </div>
      </div>
    )}

    {/* MODAL COBRAR */}
    {showCobrar&&cobrarCliente&&isAdmin&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
        <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:460,padding:26,boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <h2 style={{margin:0,fontSize:17,fontWeight:700,color:"#0F172A"}}>💳 Cobrar cliente</h2>
            <button onClick={()=>setShowCobrar(false)} style={{background:"#F1F5F9",border:"none",borderRadius:8,padding:"7px 13px",fontSize:13,cursor:"pointer"}}>✕</button>
          </div>
          <div style={{fontSize:13,color:"#64748B",marginBottom:18}}>👤 {cobrarCliente.nombre}</div>

          {/* Monto */}
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:4,textTransform:"uppercase"}}>Monto a cobrar *</label>
            <input type="number" value={cobrarMonto} onChange={e=>setCobrarMonto(e.target.value)} placeholder="0.00" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:18,fontWeight:700,outline:"none",textAlign:"center"}}/>
          </div>

          {/* Concepto */}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:4,textTransform:"uppercase"}}>Concepto *</label>
            <input value={cobrarConcepto} onChange={e=>setCobrarConcepto(e.target.value)} placeholder="Ej. Asilo I-589 — primera cuota" style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #D1D5DB",fontSize:14,outline:"none"}}/>
          </div>

          {/* Metodo */}
          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:8,textTransform:"uppercase"}}>Metodo de pago</label>
            <div style={{display:"flex",gap:8}}>
              {[["zelle","💚 Zelle"],["stripe","💳 Stripe/Tarjeta"]].map(([val,label])=>(
                <button key={val} onClick={()=>setCobrarMetodo(val)} style={{flex:1,padding:"10px",borderRadius:8,border:cobrarMetodo===val?"2px solid #1E3A5F":"1px solid #E2E8F0",background:cobrarMetodo===val?"#EFF6FF":"#F8FAFC",color:cobrarMetodo===val?"#1E3A5F":"#64748B",fontWeight:cobrarMetodo===val?700:400,fontSize:13,cursor:"pointer"}}>{label}</button>
              ))}
            </div>
          </div>

          {/* Preview mensaje WhatsApp */}
          {cobrarMonto&&cobrarConcepto&&(()=>{
            const zelleInfo=cobrarMetodo==="zelle"?`Zelle: ${pagosConfig.zelleNombre||""}${pagosConfig.zelleEmail?" — "+pagosConfig.zelleEmail:""}${pagosConfig.zelleTel?" / "+pagosConfig.zelleTel:""}`:pagosConfig.stripeLink||"(configura tu link de Stripe)";
            const msg=`Hola ${(cobrarCliente.nombre||"").split(" ")[0]}, le informamos que tiene un saldo pendiente:

*Concepto:* ${cobrarConcepto}
*Monto:* $${parseFloat(cobrarMonto||0).toFixed(2)}

*Pagar via ${cobrarMetodo==="zelle"?"Zelle":"Stripe/Tarjeta"}:*
${zelleInfo}

Gracias — ${officeData?.name||"ImmigPath"}`;
            return(
              <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"12px",marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:700,color:"#15803D",marginBottom:6}}>📱 Vista previa del mensaje</div>
                <div style={{fontSize:12,color:"#374151",whiteSpace:"pre-wrap",lineHeight:1.6}}>{msg}</div>
                <button onClick={()=>{navigator.clipboard.writeText(msg).then(()=>showToastFn("Mensaje copiado ✓"));}} style={{marginTop:8,background:"#16A34A",color:"#fff",border:"none",borderRadius:7,padding:"7px 14px",fontSize:12,cursor:"pointer",fontWeight:600}}>📋 Copiar mensaje WhatsApp</button>
              </div>
            );
          })()}

          <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
            <button onClick={()=>setShowCobrar(false)} style={{padding:"9px 18px",borderRadius:8,border:"1px solid #D1D5DB",background:"#fff",fontSize:14,cursor:"pointer"}}>Cancelar</button>
            <button onClick={async()=>{
              if(!cobrarMonto||!cobrarConcepto){showToastFn("Completa monto y concepto","error");return;}
              setCobrarSaving(true);
              const refNum="REC-"+Date.now().toString(36).toUpperCase();
              const pago={monto:cobrarMonto,concepto:cobrarConcepto,metodo:cobrarMetodo,nombreCliente:cobrarCliente.nombre,refNum};
              await registrarPago(cobrarCliente.id,pago);
              await generarReciboPDF(pago);
              setCobrarSaving(false);
              setShowCobrar(false);
              showToastFn("Pago registrado y recibo generado ✓");
            }} disabled={cobrarSaving||!cobrarMonto||!cobrarConcepto} style={{padding:"9px 20px",borderRadius:8,border:"none",background:(cobrarSaving||!cobrarMonto||!cobrarConcepto)?"#E5E7EB":"#1E3A5F",color:(cobrarSaving||!cobrarMonto||!cobrarConcepto)?"#9CA3AF":"#fff",fontSize:14,fontWeight:600,cursor:(cobrarSaving||!cobrarMonto||!cobrarConcepto)?"not-allowed":"pointer"}}>
              {cobrarSaving?"Procesando...":"✅ Registrar pago + Recibo PDF"}
            </button>
          </div>
        </div>
      </div>
    )}

        {toast&&<div style={{position:"fixed",bottom:24,right:24,background:toast.type==="error"?"#EF4444":"#0F172A",color:"#fff",padding:"11px 18px",borderRadius:10,fontSize:14,fontWeight:500,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",zIndex:200}}>{toast.msg}</div>}
  </div>);
}

//  Editor de Caso simplificado 
function CasoEditorSimple({caso,onChange,onDelete,isAdmin=true}){
  const sys=SISTEMAS[caso.sistema]||SISTEMAS.uscis;
  return(<div style={{background:"#F8FAFC",border:`2px solid ${sys.border}`,borderRadius:10,padding:"14px",marginBottom:12}}>

        ))}

    </div>
    <div style={{marginBottom:10}}>
      <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Tipo de caso</label>
      <select value={caso.tipoCaso} onChange={e=>onChange({...caso,tipoCaso:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,background:"#fff",cursor:"pointer"}}>
        <option value="">Seleccionar...</option>{SISTEMAS[caso.sistema].tiposCaso.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      {caso.sistema==="uscis"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>N° Recibo</label><input value={caso.receiptNum||""} onChange={e=>onChange({...caso,receiptNum:e.target.value.toUpperCase()})} placeholder="IOE0912345678" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>}
      <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>A# Alien</label><input value={caso.alienNum||""} onChange={e=>onChange({...caso,alienNum:e.target.value.replace(/[^\d-]/g,"")})} placeholder="012-345-678" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>
      {caso.sistema==="eoir"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Corte</label><input value={caso.corte||""} onChange={e=>onChange({...caso,corte:e.target.value})} placeholder="Miami Immigration Court" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>}
      {caso.sistema==="eoir"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Juez</label><input value={caso.juez||""} onChange={e=>onChange({...caso,juez:e.target.value})} placeholder="Hon. Rivera" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>}
    </div>

    {/* USCIS I-589 Asilo — Tipo de cita */}
    {caso.sistema==="uscis"&&(caso.tipoCaso||"").includes("I-589")&&(
      <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#1D4ED8",marginBottom:8}}>I-589 Asilo — Citas</div>
        <div style={{marginBottom:8}}>
          <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Tipo de cita</label>
          <select value={caso.tipoCita||""} onChange={e=>onChange({...caso,tipoCita:e.target.value,fechaCorte:"",fechaHuellas:""})} style={{width:"100%",padding:"7px 9px",borderRadius:6,border:"1px solid #BFDBFE",fontSize:13,background:"#fff",cursor:"pointer"}}>
            <option value="">Seleccionar...</option>
            <option value="huellas">🫆 Biometrics</option>
            <option value="entrevista">🎤 Entrevista</option>
            <option value="ambas">📅 Ambas</option>
          </select>
        </div>
        {caso.tipoCita==="huellas"&&<div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>📅 Fecha Biometrics</label><input type="date" value={caso.fechaHuellas||""} onChange={e=>onChange({...caso,fechaHuellas:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div>}
        {caso.tipoCita==="entrevista"&&<div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>🎤 Fecha de Entrevista</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div>}
        {caso.tipoCita==="ambas"&&<><div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>🫆 Fecha Biometrics</label><input type="date" value={caso.fechaHuellas||""} onChange={e=>onChange({...caso,fechaHuellas:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div><div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>🎤 Fecha de Entrevista</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BFDBFE",fontSize:13,outline:"none"}}/></div></>}
        {/* Reloj de Asilo */}
        <div style={{marginBottom:8}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#A5B4FC",marginBottom:3,textTransform:"uppercase"}}>⏱️ Fecha en que se ingresó el asilo</label><input type="date" value={caso.fechaAsilo||""} onChange={e=>onChange({...caso,fechaAsilo:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #4338CA",background:"#1E1B4B",color:"#fff",fontSize:13,outline:"none"}}/></div>
        {caso.fechaAsilo&&(()=>{const inicio=new Date(caso.fechaAsilo+"T00:00:00");const hoy=new Date();hoy.setHours(0,0,0,0);const dias=Math.floor((hoy-inicio)/86400000);const pct=Math.min(100,Math.round((dias/180)*100));const color=dias>=180?"#4ADE80":dias>=120?"#FACC15":"#60A5FA";return(<div style={{background:"#1E1B4B",border:"1px solid #4338CA",borderRadius:8,padding:"10px 12px"}}><div style={{display:"flex",alignItems:"center",gap:12}}><div style={{textAlign:"center",minWidth:50}}><div style={{fontSize:28,fontWeight:800,color,lineHeight:1}}>{dias}</div><div style={{fontSize:10,color:"#A5B4FC"}}>días</div></div><div style={{flex:1}}><div style={{background:"#312E81",borderRadius:20,height:8,overflow:"hidden",marginBottom:4}}><div style={{height:"100%",borderRadius:20,background:color,width:`${pct}%`}}/></div><div style={{fontSize:11,color,fontWeight:600}}>{dias>=180?`✅ Elegible para EAD — ${dias} días`:`⏳ Faltan ${180-dias} días para EAD`}</div></div></div></div>);})()} 
      </div>
    )}

    {/* ESTATUS DEL CASO USCIS — para todos los casos USCIS */}
    {caso.sistema==="uscis"&&<div style={{marginBottom:10}}>
      <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.04em"}}>📋 Estatus del caso USCIS</label>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        {[
          ["activo","✅ Activo","#16A34A","#F0FDF4","#BBF7D0"],
          ["referido_eoir","🔒 Cerrado — Referido a EOIR","#7C3AED","#F5F3FF","#DDD6FE"],
          ["aprobado","🔒 Cerrado — Aprobado","#0369A1","#F0F9FF","#BAE6FD"],
          ["denegado","🔒 Cerrado — Denegado","#DC2626","#FEF2F2","#FECACA"],
        ].map(([k,l,color,bg,border])=>(
          <button key={k} onClick={()=>onChange({...caso,estatusCaso:k})}
            style={{padding:"8px 8px",borderRadius:8,border:caso.estatusCaso===k?`2px solid ${color}`:`1px solid ${border}`,background:caso.estatusCaso===k?bg:"#fff",color:caso.estatusCaso===k?color:"#374151",fontWeight:caso.estatusCaso===k?700:400,fontSize:11,cursor:"pointer",textAlign:"center"}}>
            {l}
          </button>
        ))}
      </div>
    </div>}

    {/* EOIR fecha de corte */}
    {caso.sistema==="eoir"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>📅 Fecha de corte</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>}

    {/* I-765 Permiso de trabajo — EAD */}
    {caso.sistema==="uscis"&&(caso.tipoCaso||"").includes("I-765")&&<div style={{marginBottom:10}}>
      <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:6,textTransform:"uppercase"}}>💼 Permiso de trabajo (EAD)</label>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
        {[["si","✅ Sí tiene"],["no","❌ No tiene"]].map(([k,l])=>(
          <button key={k} onClick={()=>onChange({...caso,tieneEAD:k,eadVence:"",eadRenovado:""})}
            style={{padding:"7px",borderRadius:7,border:caso.tieneEAD===k?`2px solid ${k==="si"?"#16A34A":"#DC2626"}`:"1px solid #E2E8F0",background:caso.tieneEAD===k?(k==="si"?"#F0FDF4":"#FEF2F2"):"#fff",color:caso.tieneEAD===k?(k==="si"?"#15803D":"#DC2626"):"#374151",fontWeight:caso.tieneEAD===k?700:400,fontSize:12,cursor:"pointer"}}>
            {l}
          </button>
        ))}
      </div>
      {caso.tieneEAD==="si"&&<div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"10px 12px",marginBottom:7}}>
        <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase"}}>📅 Fecha de vencimiento del EAD</label>
        <input type="date" value={caso.eadVence||""} onChange={e=>onChange({...caso,eadVence:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #BBF7D0",fontSize:13,outline:"none",marginBottom:7}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
          {[["si","✅ Renovado"],["no","⏳ Pendiente renovar"]].map(([k,l])=>(
            <button key={k} onClick={()=>onChange({...caso,eadRenovado:k})}
              style={{padding:"6px",borderRadius:7,border:caso.eadRenovado===k?`2px solid ${k==="si"?"#16A34A":"#D97706"}`:"1px solid #E2E8F0",background:caso.eadRenovado===k?(k==="si"?"#F0FDF4":"#FFFBEB"):"#fff",color:caso.eadRenovado===k?(k==="si"?"#15803D":"#D97706"):"#374151",fontWeight:caso.eadRenovado===k?700:400,fontSize:12,cursor:"pointer"}}>
              {l}
            </button>
          ))}
        </div>
      </div>}
      {caso.tieneEAD==="no"&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 12px",marginBottom:7}}>
        <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:5,textTransform:"uppercase"}}>📅 Fecha en que puede aplicar al EAD</label>
        <input type="date" value={caso.eadVence||""} onChange={e=>onChange({...caso,eadVence:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #FECACA",fontSize:13,outline:"none"}}/>
      </div>}
    </div>}

    {/* USCIS otros casos (no I-589, no I-765) */}
    {caso.sistema==="uscis"&&!(caso.tipoCaso||"").includes("I-589")&&!(caso.tipoCaso||"").includes("I-765")&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>📅 Fecha de cita</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>}

    {/* FOIA */}
    {caso.sistema==="foia"&&<>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Tracking FOIA</label><input value={caso.foiaTracking||""} onChange={e=>onChange({...caso,foiaTracking:e.target.value})} placeholder="NRC2024123456" style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,fontFamily:"monospace",outline:"none"}}/></div>
        <div><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Estado FOIA</label>
          <select value={caso.foiaEstado||""} onChange={e=>onChange({...caso,foiaEstado:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,background:"#fff",cursor:"pointer"}}>
            <option value="">Seleccionar...</option>
            <option value="Enviado">📤 Enviado</option>
            <option value="En proceso">⏳ En proceso</option>
            <option value="Respuesta recibida">✅ Respuesta recibida</option>
            <option value="Cerrado">🔒 Cerrado</option>
          </select>
        </div>
      </div>
      <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>📅 Fecha de envío</label><input type="date" value={caso.fechaCorte||""} onChange={e=>onChange({...caso,fechaCorte:e.target.value})} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,outline:"none"}}/></div>
      <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Respuesta / Notas FOIA</label><textarea value={caso.foiaRespuesta||""} onChange={e=>onChange({...caso,foiaRespuesta:e.target.value})} placeholder="Notas de la respuesta..." rows={2} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,resize:"vertical",outline:"none"}}/></div>
    </>}
    <div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",marginBottom:3,textTransform:"uppercase"}}>Notas del caso</label><textarea value={caso.nota||""} onChange={e=>onChange({...caso,nota:e.target.value})} placeholder="Observaciones..." rows={2} style={{width:"100%",padding:"7px 10px",borderRadius:7,border:"1px solid #D1D5DB",fontSize:13,resize:"vertical",outline:"none"}}/></div>
    <ProcesosEditor procesos={caso.procesos||[]} onChange={v=>onChange({...caso,procesos:v})}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
